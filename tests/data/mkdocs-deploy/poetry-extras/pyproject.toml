[tool.poetry]
name = "test-mkdocs-deploy-poetry-extras"
version = "0.1.0"
description = "Fixture for mkdocs-deploy: poetry with mike + mkdocs as the docs extra (no group)"
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
mike = { version = "*", optional = true }
mkdocs = { version = "*", optional = true }

[tool.poetry.extras]
docs = ["mike", "mkdocs"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
