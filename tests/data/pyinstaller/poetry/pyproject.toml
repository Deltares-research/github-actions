[tool.poetry]
name = "test-pyinstaller-poetry"
version = "0.1.0"
description = "Fixture for executable/pyinstaller: poetry with pyinstaller in the dev group"
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
