[project]
name = "test-uv-stale"
version = "0.1.0"
description = "Fixture for python-setup/uv: pyproject is intentionally newer than the lock (verify-lock should fail). Lock was generated with only `requests`; pyproject lists more deps so `uv lock --check` fails."
requires-python = ">=3.12"
dependencies = ["requests", "click"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
