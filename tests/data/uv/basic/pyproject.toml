[project]
name = "test-uv-basic"
version = "0.1.0"
description = "Fixture for python-setup/uv: single dev + docs groups"
requires-python = ">=3.12"
dependencies = ["requests"]

[dependency-groups]
dev = ["pytest"]
docs = ["sphinx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
