[project]
name = "test-uv-combined"
version = "0.1.0"
description = "Fixture for python-setup/uv: groups + extras together"
requires-python = ">=3.12"
dependencies = ["requests"]

[project.optional-dependencies]
docs = ["sphinx"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
