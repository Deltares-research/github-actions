[project]
name = "test-uv-multi"
version = "0.1.0"
description = "Fixture for python-setup/uv: three groups (dev, docs, test)"
requires-python = ">=3.12"
dependencies = ["requests"]

[dependency-groups]
dev = ["pytest", "black"]
docs = ["sphinx", "mkdocs"]
test = ["coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
