[tool.poetry]
name = "test-poetry-combined"
version = "0.1.0"
description = "Fixture for python-setup/poetry: groups + extras together"
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "*"
sphinx = { version = "*", optional = true }

[tool.poetry.extras]
docs = ["sphinx"]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
