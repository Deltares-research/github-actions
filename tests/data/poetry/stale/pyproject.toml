[tool.poetry]
name = "test-poetry-stale"
version = "0.1.0"
description = "Fixture for python-setup/poetry: pyproject is intentionally newer than the lock (verify-lock should fail). Lock generated with only `requests`; pyproject lists more deps so `poetry check --lock` fails."
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "*"
click = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
