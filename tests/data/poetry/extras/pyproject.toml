[tool.poetry]
name = "test-poetry-extras"
version = "0.1.0"
description = "Fixture for python-setup/poetry: extras-based optional deps"
authors = ["Test <test@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "*"
sphinx = { version = "*", optional = true }
pytest = { version = "*", optional = true }

[tool.poetry.extras]
docs = ["sphinx"]
dev = ["pytest"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
