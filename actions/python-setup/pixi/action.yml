name: 'Setup Python with Pixi'
description: 'Setup Python environment with Pixi and install environments, with lock-file caching'

inputs:
  version:
    description: 'Pixi version to install. Empty string falls back to the default. Example: "v0.49.0", "v0.48.0", "latest".'
    required: false
    default: 'v0.49.0'
  environments:
    description: 'Pixi environments to install (space-separated; passed through to setup-pixi). Empty means the default environment. Example: "", "py312", "py311 py312".'
    required: false
    default: ''
  activate-environment:
    description: 'Pixi environment to activate on PATH after install, so plain `python` resolves into that env. Must also be listed in `environments`. Example: "py312", "default".'
    required: false
    default: ''
  verify-lock:
    description: 'Whether to run pixi install --locked to confirm pixi.lock matches the manifest. Example: "true", "false".'
    required: false
    default: 'true'
  cache-write:
    description: 'Whether to write to the pixi cache. Set to "false" (or a workflow expression evaluating to "false" on PRs) to skip cache writes and save cache space. Example: "true", "false".'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve Pixi version
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # A wrapper action forwarding an unset value sends an explicit empty
        # string, which bypasses this input's `default:`. Fall back to the pinned
        # default here so an empty value always resolves to it.
        # Keep the fallback in sync with the `version` input default above.
        echo "version=${VERSION:-v0.49.0}" >> "$GITHUB_OUTPUT"

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.14
      with:
        pixi-version: ${{ steps.resolve.outputs.version }}
        environments: ${{ inputs.environments }}
        activate-environment: ${{ inputs.activate-environment }}
        cache: true
        cache-key: pixi-${{ runner.os }}-pixi${{ steps.resolve.outputs.version }}-${{ hashFiles('**/pixi.lock') }}
        cache-write: ${{ inputs.cache-write }}

    - name: Verify lock file is up to date
      if: inputs.verify-lock == 'true'
      shell: bash
      run: |
        echo "::group::Verifying pixi.lock is up to date"
        pixi install --locked
        echo "::endgroup::"

    - name: List environment contents
      shell: bash
      run: |
        echo "::group::Installed packages summary"
        pixi list
        echo "::endgroup::"
