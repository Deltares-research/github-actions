name: 'Setup Python with pip + venv'
description: 'Create a virtualenv at .venv and install dependencies via pip from requirements files and/or pyproject.toml, with download-cache speedup'

inputs:
  python-version:
    description: 'Python version to install. Example: "3.12", "3.13", "3.12.5".'
    required: false
    default: '3.12'
  version:
    description: 'pip version to pin inside the venv. Empty or omitted falls back to the pinned default (DEFAULT_VERSION in the "Resolve pip version" step). Example: "26.1.2", "24.3.1".'
    required: false
    default: ''
  requirements-files:
    description: 'Space- or comma-separated requirements files to install with `pip install -r`. Example: "requirements.txt", "requirements.txt requirements-dev.txt", "reqs/base.txt,reqs/dev.txt".'
    required: false
    default: ''
  install-project:
    description: 'Whether to run `pip install .` to install the current project from pyproject.toml/setup.py. Example: "true", "false".'
    required: false
    default: 'false'
  install-extras:
    description: 'Comma- or space-separated PEP 621 extras to install when install-project is true (becomes `pip install ".[X,Y]"`). Ignored when install-project is false. Example: "docs", "dev,docs", "dev docs".'
    required: false
    default: ''
  cache-write:
    description: 'Whether to write to the cache. Set to "false" (or a workflow expression evaluating to "false" on PRs) to skip cache writes and save cache space. Example: "true", "false".'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve pip version
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # Single source of truth for the default pip version. A composite action
        # can't declare a top-level constant, so it lives here on the first step;
        # an empty or omitted `version` input resolves to it.
        DEFAULT_VERSION: '26.1.2'
      run: |
        echo "version=${VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore pip download cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-py${{ inputs.python-version }}-pip${{ steps.resolve.outputs.version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}

    - name: Create venv and activate
      # Activation via GITHUB_PATH puts .venv/bin first on PATH for all
      # subsequent steps in this job, so plain `python` and `pip` resolve into
      # the venv without needing per-step `source .venv/bin/activate`.
      shell: bash
      run: |
        echo "::group::Creating venv at .venv"
        python -m venv .venv
        echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
        echo "::endgroup::"

    - name: Upgrade pip
      shell: bash
      env:
        PIP_VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        echo "::group::Upgrading pip"
        .venv/bin/python -m pip install --upgrade "pip==$PIP_VERSION"
        .venv/bin/python -m pip --version
        echo "::endgroup::"

    - name: Install requirements files
      if: inputs.requirements-files != ''
      shell: bash
      env:
        REQ_FILES: ${{ inputs.requirements-files }}
      run: |
        echo "::group::Installing from requirements files"
        IFS=' ,' read -r -a files <<< "$REQ_FILES"
        for f in "${files[@]}"; do
          if [[ -n "$f" ]]; then
            echo "Installing from $f"
            .venv/bin/python -m pip install -r "$f"
          fi
        done
        echo "::endgroup::"

    - name: Install project
      if: inputs.install-project == 'true'
      shell: bash
      env:
        EXTRAS: ${{ inputs.install-extras }}
      run: |
        echo "::group::Installing project"
        if [[ -n "$EXTRAS" ]]; then
          # pip's `.[a,b]` syntax requires comma-separated, no spaces inside the
          # brackets. Normalise: spaces→commas, collapse repeated commas, strip
          # leading/trailing commas. So "dev docs", "dev,docs", and
          # " dev , docs " all produce ".[dev,docs]".
          NORMALIZED=$(echo "$EXTRAS" | tr ' ' ',' | tr -s ',' | sed 's/^,//;s/,$//')
          echo "Installing project with extras: [$NORMALIZED]"
          .venv/bin/python -m pip install ".[${NORMALIZED}]"
        else
          echo "Installing project (no extras)"
          .venv/bin/python -m pip install .
        fi
        echo "::endgroup::"

    - name: List environment contents
      shell: bash
      run: |
        echo "::group::Installed packages summary"
        .venv/bin/python -m pip list
        echo "::endgroup::"

    - name: Save pip download cache
      if: inputs.cache-write == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-py${{ inputs.python-version }}-pip${{ steps.resolve.outputs.version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
