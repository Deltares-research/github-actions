name: 'Setup Python with uv'
description: 'Setup Python environment with uv package manager and install dependencies'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'
  uv-version:
    description: 'uv version to install (empty = latest)'
    required: false
    default: ''
  install-groups:
    description: 'Dependency groups to install via --group (e.g., "dev", "dev docs")'
    required: false
    default: ''
  install-extras:
    description: 'Optional-dependency extras to install via --extra (e.g., "dev,docs")'
    required: false
    default: ''
  verify-lock:
    description: 'Whether to verify the uv.lock file is up to date'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Verify lock file is up to date
      if: inputs.verify-lock == 'true'
      shell: bash
      run: |
        echo "::group::Verifying uv.lock file is up to date"
        uv lock --check
        echo "::endgroup::"

    - name: Install Dependencies
      shell: bash
      run: |
        echo "::group::Preparing uv sync command"
        args=("--frozen")

        if [[ -n "${{ inputs.install-extras }}" ]]; then
          echo "Installing extras: ${{ inputs.install-extras }}"
          IFS=' ,' read -r -a extras <<< "${{ inputs.install-extras }}"
          for extra in "${extras[@]}"; do
            extra=$(echo "$extra" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [[ -n "$extra" ]]; then
              args+=("--extra" "$extra")
            fi
          done
        fi

        if [[ -n "${{ inputs.install-groups }}" ]]; then
          echo "Installing groups: ${{ inputs.install-groups }}"
          IFS=' ,' read -r -a groups <<< "${{ inputs.install-groups }}"
          for group in "${groups[@]}"; do
            group=$(echo "$group" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [[ -n "$group" ]]; then
              args+=("--group" "$group")
            fi
          done
        fi

        echo "Running: uv sync ${args[*]}"
        echo "::endgroup::"

        echo "::group::Installing dependencies with uv"
        uv sync "${args[@]}"
        echo "::endgroup::"

    - name: List environment contents
      shell: bash
      run: |
        echo "::group::Installed packages summary"
        uv pip list
        echo "::endgroup::"
