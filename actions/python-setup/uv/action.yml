name: 'Setup Python with uv'
description: 'Setup Python environment with uv package manager and install dependencies'

inputs:
  python-version:
    description: 'Python version to install. Example: "3.12", "3.13", "3.12.5".'
    required: false
    default: '3.12'
  version:
    description: 'uv version to install. Empty or omitted falls back to the pinned default (DEFAULT_VERSION in the "Resolve uv version" step). Example: "0.11.28", "0.9.8".'
    required: false
    default: ''
  install-groups:
    description: 'PEP 735 dependency groups to install via uv sync --group. Space- or comma-separated. Example: "dev", "dev docs", "dev,docs".'
    required: false
    default: ''
  install-extras:
    description: 'PEP 621 optional-dependency extras to install via uv sync --extra. Space- or comma-separated. Example: "docs", "dev docs", "dev,docs".'
    required: false
    default: ''
  verify-lock:
    description: 'Whether to run uv lock --check before install to confirm uv.lock matches pyproject.toml. Example: "true", "false".'
    required: false
    default: 'true'
  cache-write:
    description: 'Whether to write to the cache. Set to "false" (or a workflow expression evaluating to "false" on PRs) to skip cache writes and save cache space. Example: "true", "false".'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve uv version
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # Single source of truth for the default uv version. A composite action
        # can't declare a top-level constant, so it lives here on the first step;
        # an empty or omitted `version` input resolves to it.
        DEFAULT_VERSION: '0.11.28'
      run: |
        echo "version=${VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: ${{ steps.resolve.outputs.version }}

    - name: Restore uv download cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-uv${{ steps.resolve.outputs.version }}-${{ hashFiles('**/uv.lock') }}

    - name: Verify lock file is up to date
      if: inputs.verify-lock == 'true'
      shell: bash
      run: |
        echo "::group::Verifying uv.lock file is up to date"
        uv lock --check
        echo "::endgroup::"

    - name: Install Dependencies
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.install-groups }}
        INSTALL_EXTRAS: ${{ inputs.install-extras }}
      run: |
        echo "::group::Preparing uv sync command"
        args=("--frozen")

        if [[ -n "$INSTALL_EXTRAS" ]]; then
          echo "Installing extras: $INSTALL_EXTRAS"
          IFS=' ,' read -r -a extras <<< "$INSTALL_EXTRAS"
          for extra in "${extras[@]}"; do
            if [[ -n "$extra" ]]; then
              args+=("--extra" "$extra")
            fi
          done
        fi

        if [[ -n "$INSTALL_GROUPS" ]]; then
          echo "Installing groups: $INSTALL_GROUPS"
          IFS=' ,' read -r -a groups <<< "$INSTALL_GROUPS"
          for group in "${groups[@]}"; do
            if [[ -n "$group" ]]; then
              args+=("--group" "$group")
            fi
          done
        fi

        echo "Running: uv sync ${args[*]}"
        echo "::endgroup::"

        echo "::group::Installing dependencies with uv"
        uv sync "${args[@]}"
        echo "::endgroup::"

    - name: List environment contents
      shell: bash
      run: |
        echo "::group::Installed packages summary"
        uv pip list
        echo "::endgroup::"

    - name: Save uv download cache
      if: inputs.cache-write == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-uv${{ steps.resolve.outputs.version }}-${{ hashFiles('**/uv.lock') }}
