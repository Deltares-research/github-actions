name: 'Setup Python with Poetry'
description: 'Setup Python environment with Poetry and install dependencies, with virtualenv caching'

inputs:
  python-version:
    description: 'Python version to install. Example: "3.12", "3.13", "3.12.5".'
    required: false
    default: '3.12'
  version:
    description: 'Poetry version to install. Requires Poetry >= 2.0 (uses the `poetry sync` command). Empty or omitted falls back to the pinned default (DEFAULT_VERSION in the "Resolve Poetry version" step). Example: "2.3.3", "2.3.0", "2.0.1".'
    required: false
    default: ''
  install-groups:
    description: 'Poetry groups to install via poetry sync --with. Space- or comma-separated. Example: "dev", "dev docs", "dev,docs".'
    required: false
    default: ''
  install-extras:
    description: 'Poetry extras to install via poetry sync --extras. Space- or comma-separated. Example: "docs", "dev docs", "dev,docs".'
    required: false
    default: ''
  verify-lock:
    description: 'Whether to run poetry check --lock before install to confirm poetry.lock matches pyproject.toml. Example: "true", "false".'
    required: false
    default: 'true'
  cache-write:
    description: 'Whether to write to the cache. Set to "false" (or a workflow expression evaluating to "false" on PRs) to skip cache writes and save cache space. Example: "true", "false".'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve Poetry version
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # Single source of truth for the default Poetry version. A composite action
        # can't declare a top-level constant, so it lives here on the first step;
        # an empty or omitted `version` input resolves to it.
        DEFAULT_VERSION: '2.3.3'
      run: |
        echo "version=${VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
      with:
        poetry-version: ${{ steps.resolve.outputs.version }}

    - name: Set Poetry config
      shell: bash
      run: |
        echo "::group::Configuring Poetry"
        poetry config virtualenvs.in-project false
        poetry config virtualenvs.path ~/.virtualenvs
        echo "::endgroup::"

    - name: Restore Poetry virtualenv
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: cache
      with:
        path: ~/.virtualenvs
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-poetry${{ steps.resolve.outputs.version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Verify lock file is up to date
      if: inputs.verify-lock == 'true'
      shell: bash
      run: |
        echo "::group::Verifying poetry.lock file is up to date"
        poetry check --lock
        echo "::endgroup::"

    - name: Sync Dependencies
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.install-groups }}
        INSTALL_EXTRAS: ${{ inputs.install-extras }}
      run: |
        echo "::group::Preparing Poetry sync command"
        # `poetry sync` reconciles the venv to exactly match the lock + selected
        # groups/extras, removing anything else. This means a cache-restored
        # venv from a previous run with different inputs is corrected to match
        # the current request — no cross-input contamination.
        args=()

        if [[ -n "$INSTALL_EXTRAS" ]]; then
          echo "Installing extras: $INSTALL_EXTRAS"
          IFS=' ,' read -r -a extras <<< "$INSTALL_EXTRAS"
          for extra in "${extras[@]}"; do
            if [[ -n "$extra" ]]; then
              args+=("--extras" "$extra")
            fi
          done
        fi

        if [[ -n "$INSTALL_GROUPS" ]]; then
          echo "Installing groups: $INSTALL_GROUPS"
          IFS=' ,' read -r -a groups <<< "$INSTALL_GROUPS"
          for group in "${groups[@]}"; do
            if [[ -n "$group" ]]; then
              args+=("--with" "$group")
            fi
          done
        fi

        echo "Running: poetry sync ${args[*]}"
        echo "::endgroup::"

        echo "::group::Syncing dependencies with Poetry"
        poetry sync "${args[@]}"
        echo "::endgroup::"

    - name: List environment contents
      shell: bash
      env:
        # Force UTF-8 on Python's stdout. Required on Windows where the default
        # `cp1252` codec can't encode emojis or other non-ASCII characters that
        # appear in some package descriptions (e.g. meshkernel's snake emoji),
        # which would otherwise crash `poetry show` with a UnicodeEncodeError.
        PYTHONUTF8: '1'
        PYTHONIOENCODING: 'utf-8'
      run: |
        echo "::group::Installed packages summary"
        poetry show
        echo "::endgroup::"

    - name: Save Poetry virtualenv
      if: inputs.cache-write == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.virtualenvs
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-poetry${{ steps.resolve.outputs.version }}-${{ hashFiles('**/poetry.lock') }}
