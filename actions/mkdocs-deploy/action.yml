name: 'MkDocs Deploy'
description: |
  Stand-alone composite action that sets up a Python environment and deploys
  versioned MkDocs documentation to GitHub Pages using mike.

  Python setup is delegated to `actions/python-setup/<package-manager>` —
  install-groups and install-extras are forwarded unchanged.

  Each invocation runs exactly one deploy path, selected by `trigger`. Event
  matching is the caller's responsibility — gate the calling job on the right
  GitHub event with a job-level `if:`. The composite trusts what it is told:
    * pr      → mike deploy --push develop
    * main    → mike deploy --push main
                  (+ set-default main, unless main-set-default=false)
    * release → if release-prerelease=true:
                    mike deploy --push <release-tag>
                else:
                    mike deploy --push --update-aliases <release-tag> <release-alias>
                    + set-default <release-alias>

inputs:
  python-version:
    description: 'Python version to install. Example: "3.12", "3.13", "3.12.5".'
    required: false
    default: '3.12'
  package-manager:
    description: 'Package manager to set up Python with. Example: "uv", "poetry", "pixi".'
    required: false
    default: 'uv'
  install-groups:
    description: 'PEP 735 dependency groups to install (uv --group / poetry --with). Space- or comma-separated. Example: "docs", "dev docs", "dev,docs".'
    required: false
    default: 'docs'
  install-extras:
    description: 'PEP 621 optional-dependency extras to install (uv --extra / poetry --extras). Space- or comma-separated. Coexists with install-groups. Example: "docs", "dev docs", "dev,docs".'
    required: false
    default: ''
  trigger:
    description: 'Which deploy path to run on this invocation. The caller workflow must gate on the matching GitHub event via job-level `if:` — the composite does not double-check `github.event_name`. Choose one of {pr, main, release}. Example: "main".'
    required: true
  deploy-token:
    description: 'GitHub token used by mike to push to gh-pages. Needs `contents: write`. Example: "${{ secrets.GITHUB_TOKEN }}".'
    required: true
  release-tag:
    description: 'Release tag deployed by mike when the release path fires. Typically the release event payload tag. Example: "v1.0.0", "${{ github.event.release.tag_name }}".'
    required: false
    default: ''
  release-alias:
    description: 'Mike alias the release version is published under (and which is then set as the default served version). Example: "latest", "stable".'
    required: false
    default: 'latest'
  main-set-default:
    description: 'Whether the main deploy path also runs `mike set-default --push main`. Set to "false" for libraries that publish stable releases and want the released alias (not main) to remain the default served version. Example: "true", "false".'
    required: false
    default: 'true'
  release-prerelease:
    description: 'Whether the release being deployed is a prerelease (alpha/beta/rc). When "true", the release deploy path publishes the tag alone — no `--update-aliases` and no `set-default` — so the prerelease does not displace the stable served default. Typically set to "${{ github.event.release.prerelease }}" or computed from the tag pattern. Example: "true", "false".'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Log deployment configuration
      shell: bash
      run: |
        echo "::group::MkDocs Deployment Configuration"
        echo "Python version:    ${{ inputs.python-version }}"
        echo "Package manager:   ${{ inputs.package-manager }}"
        echo "Install groups:    ${{ inputs.install-groups }}"
        echo "Install extras:    ${{ inputs.install-extras }}"
        echo "Trigger:           ${{ inputs.trigger }}"
        echo "Release tag:       ${{ inputs.release-tag }}"
        echo "Release alias:     ${{ inputs.release-alias }}"
        echo "Main set-default:  ${{ inputs.main-set-default }}"
        echo "Release prerelease:${{ inputs.release-prerelease }}"
        echo "Event name:        ${{ github.event_name }}"
        echo "Ref:               ${{ github.ref }}"
        echo "::endgroup::"

    # Python environment setup — delegated to actions/python-setup/<pm>
    - name: Setup Python with uv
      if: inputs.package-manager == 'uv'
      uses: Deltares-research/github-actions/actions/python-setup/uv@main
      with:
        python-version: ${{ inputs.python-version }}
        install-groups: ${{ inputs.install-groups }}
        install-extras: ${{ inputs.install-extras }}

    - name: Setup Python with Poetry
      if: inputs.package-manager == 'poetry'
      uses: Deltares-research/github-actions/actions/python-setup/poetry@main
      with:
        python-version: ${{ inputs.python-version }}
        install-groups: ${{ inputs.install-groups }}
        install-extras: ${{ inputs.install-extras }}

    - name: Setup Python with Pixi
      if: inputs.package-manager == 'pixi'
      uses: Deltares-research/github-actions/actions/python-setup/pixi@main
      with:
        python-version: ${{ inputs.python-version }}

    # Configure git so mike can push to gh-pages
    - name: Configure git
      shell: bash
      run: |
        echo "::group::Configuring Git for deployment"
        git config --global user.name '${{ github.actor }}'
        git config --global user.email '${{ github.actor }}@users.noreply.github.com'
        echo "Git configured for user: ${{ github.actor }}"
        echo "::endgroup::"

    - name: Deploy PR Documentation
      if: inputs.trigger == 'pr'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
      run: |
        echo "::group::Deploying PR documentation to 'develop' version"
        echo "Package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          "uv")     runner="uv run" ;;
          "poetry") runner="poetry run" ;;
          "pixi")   runner="pixi run" ;;
          *)        runner="" ;;
        esac

        ${runner} mike deploy --push develop
        echo "::endgroup::"

    - name: Deploy Main Documentation
      if: inputs.trigger == 'main'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        SET_DEFAULT: ${{ inputs.main-set-default }}
      run: |
        echo "::group::Deploying main branch documentation"
        echo "Package manager: ${{ inputs.package-manager }}"
        echo "Set main as default: ${SET_DEFAULT}"
        case "${{ inputs.package-manager }}" in
          "uv")     runner="uv run" ;;
          "poetry") runner="poetry run" ;;
          "pixi")   runner="pixi run" ;;
          *)        runner="" ;;
        esac

        echo "Deploying main version..."
        ${runner} mike deploy --push main

        if [[ "${SET_DEFAULT}" == "true" ]]; then
          echo "Setting main as default..."
          ${runner} mike set-default --push main
        else
          echo "Skipping set-default (main-set-default=${SET_DEFAULT})"
        fi
        echo "::endgroup::"

    - name: Deploy Release Documentation
      if: inputs.trigger == 'release'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        RELEASE_TAG_VERSION: ${{ inputs.release-tag }}
        RELEASE_ALIAS: ${{ inputs.release-alias }}
        IS_PRERELEASE: ${{ inputs.release-prerelease }}
      run: |
        echo "::group::Deploying release documentation"
        echo "Release tag: ${RELEASE_TAG_VERSION}"
        echo "Release alias: ${RELEASE_ALIAS}"
        echo "Prerelease: ${IS_PRERELEASE}"
        echo "Package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          "uv")     runner="uv run" ;;
          "poetry") runner="poetry run" ;;
          "pixi")   runner="pixi run" ;;
          *)        runner="" ;;
        esac

        if [[ "${IS_PRERELEASE}" == "true" ]]; then
          echo "Deploying prerelease ${RELEASE_TAG_VERSION} as a standalone version (no alias, no set-default)..."
          ${runner} mike deploy --push "${RELEASE_TAG_VERSION}"
        else
          echo "Deploying release ${RELEASE_TAG_VERSION} and updating '${RELEASE_ALIAS}' alias..."
          ${runner} mike deploy --push --update-aliases "${RELEASE_TAG_VERSION}" "${RELEASE_ALIAS}"
          echo "Setting '${RELEASE_ALIAS}' as default..."
          ${runner} mike set-default --push "${RELEASE_ALIAS}"
        fi
        echo "::endgroup::"
