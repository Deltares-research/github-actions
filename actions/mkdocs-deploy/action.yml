name: 'Complete MkDocs Deploy'
description: 'Stand-alone MkDocs workflow - sets up Python via actions/python-setup, then deploys docs to GitHub Pages with mike'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'
  package-manager:
    description: 'Package manager to use (uv, poetry, pixi)'
    required: false
    default: 'uv'
  dependency-groups:
    description: 'Dependency groups to install (uv --group / poetry --with). Space- or comma-separated.'
    required: false
    default: 'docs'
  poetry-extras:
    description: 'Poetry extras to install (--extras). When set, dependency-groups is ignored for poetry to preserve previous behavior.'
    required: false
    default: ''
  deploy-types:
    description: 'Comma-separated list of deploy types to run (pr, main, release)'
    required: true
  deploy-token:
    description: 'GitHub token for deployment'
    required: true
  release-tag:
    description: 'Release tag for version deployment'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Log deployment configuration
      shell: bash
      run: |
        echo "::group::MkDocs Deployment Configuration"
        echo "Python version: ${{ inputs.python-version }}"
        echo "Package manager: ${{ inputs.package-manager }}"
        echo "Dependency groups: ${{ inputs.dependency-groups }}"
        echo "Poetry extras: ${{ inputs.poetry-extras }}"
        echo "Deploy types: ${{ inputs.deploy-types }}"
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "::endgroup::"

    # Python environment setup — delegated to actions/python-setup/<pm>
    - name: Setup Python with uv
      if: inputs.package-manager == 'uv'
      uses: Deltares-research/github-actions/actions/python-setup/uv@main
      with:
        python-version: ${{ inputs.python-version }}
        install-groups: ${{ inputs.dependency-groups }}
        install-extras: ${{ inputs.poetry-extras }}

    - name: Setup Python with Poetry
      if: inputs.package-manager == 'poetry'
      uses: Deltares-research/github-actions/actions/python-setup/poetry@main
      with:
        python-version: ${{ inputs.python-version }}
        install-groups: ${{ inputs.poetry-extras == '' && inputs.dependency-groups || '' }}
        install-extras: ${{ inputs.poetry-extras }}

    - name: Setup Python with Pixi
      if: inputs.package-manager == 'pixi'
      uses: Deltares-research/github-actions/actions/python-setup/pixi@main
      with:
        python-version: ${{ inputs.python-version }}

    # Configure git so mike can push to gh-pages
    - name: Configure git
      shell: bash
      run: |
        echo "::group::Configuring Git for deployment"
        git config --global user.name '${{ github.actor }}'
        git config --global user.email '${{ github.actor }}@users.noreply.github.com'
        echo "Git configured for user: ${{ github.actor }}"
        echo "::endgroup::"

    - name: Deploy PR Documentation
      if: contains(inputs.deploy-types, 'pr') && github.event_name == 'pull_request'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
      run: |
        echo "::group::Deploying PR documentation to 'develop' version"
        echo "Package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          "uv")
            uv run mike deploy --push develop
            ;;
          "poetry")
            poetry run mike deploy --push develop
            ;;
          "pixi")
            pixi run mike deploy --push develop
            ;;
          *)
            mike deploy --push develop
            ;;
        esac
        echo "::endgroup::"

    - name: Deploy Main Documentation
      if: contains(inputs.deploy-types, 'main') && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
      run: |
        echo "::group::Deploying main branch documentation"
        echo "Package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          "uv")
            echo "Deploying main version..."
            uv run mike deploy --push main
            echo "Setting main as default..."
            uv run mike set-default --push main
            ;;
          "poetry")
            echo "Deploying main version..."
            poetry run mike deploy --push main
            echo "Setting main as default..."
            poetry run mike set-default --push main
            ;;
          "pixi")
            echo "Deploying main version..."
            pixi run mike deploy --push main
            echo "Setting main as default..."
            pixi run mike set-default --push main
            ;;
          *)
            echo "Deploying main version..."
            mike deploy --push main
            echo "Setting main as default..."
            mike set-default --push main
            ;;
        esac
        echo "::endgroup::"

    - name: Deploy Release Documentation
      if: contains(inputs.deploy-types, 'release') && github.event_name == 'release'
      shell: bash
      env:
        ACTIONS_DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        RELEASE_TAG_VERSION: ${{ inputs.release-tag }}
      run: |
        echo "::group::Deploying release documentation"
        echo "Release tag: ${RELEASE_TAG_VERSION}"
        echo "Package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          "uv")
            echo "Deploying release ${RELEASE_TAG_VERSION} and updating 'latest' alias..."
            uv run mike deploy --push --update-aliases ${RELEASE_TAG_VERSION} latest
            echo "Setting 'latest' as default..."
            uv run mike set-default --push latest
            ;;
          "poetry")
            echo "Deploying release ${RELEASE_TAG_VERSION} and updating 'latest' alias..."
            poetry run mike deploy --push --update-aliases ${RELEASE_TAG_VERSION} latest
            echo "Setting 'latest' as default..."
            poetry run mike set-default --push latest
            ;;
          "pixi")
            echo "Deploying release ${RELEASE_TAG_VERSION} and updating 'latest' alias..."
            pixi run mike deploy --push --update-aliases ${RELEASE_TAG_VERSION} latest
            echo "Setting 'latest' as default..."
            pixi run mike set-default --push latest
            ;;
          *)
            echo "Deploying release ${RELEASE_TAG_VERSION} and updating 'latest' alias..."
            mike deploy --push --update-aliases ${RELEASE_TAG_VERSION} latest
            echo "Setting 'latest' as default..."
            mike set-default --push latest
            ;;
        esac
        echo "::endgroup::"
