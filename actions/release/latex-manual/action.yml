name: 'Generate LaTeX Documentation'
description: |
  Convert Markdown to LaTeX (and optionally PDF) using the ddocs CLI
  (https://github.com/Deltares-research/doc_utils). Deltares LaTeX styles are
  fetched by ddocs (get-tex-template) from the internal Deltares/LatexInstallation
  repo.

  Self-contained: installs its own Python and ddocs (ddocs bundles pandoc via
  pypandoc-binary), and TeX Live via apt when compiling PDFs. Does NOT touch the
  consumer's pyproject, lock file, or virtualenv — the action is a documentation
  pipeline that runs in isolation from the project's own dependency management.

inputs:
  python-version:
    description: 'Python version to install. ddocs requires >= 3.11.'
    required: false
    default: '3.12'
  tex-files:
    description: |
      Comma-separated list of .tex files (without extension) to compile to PDF.
      Empty means: run markdown-to-latex conversion only, skip pdflatex (and
      the heavy texlive install).
    required: false
    default: ''
  markdown-input-dir:
    description: |
      Input directory containing Markdown files to convert to LaTeX.
      Set to '' to skip the markdown-to-latex step entirely — use this when the
      LaTeX sources are authored directly (no Markdown) and you only want the
      style fetch + pdflatex compile.
    required: false
    default: 'docs/mkdocs/user_docs'
  latex-output-dir:
    description: 'Output directory for LaTeX (and PDF) files.'
    required: false
    default: 'docs/end-user-docs/source'
  latex-template-token:
    description: |
      Token with read access to the internal Deltares/LatexInstallation repo,
      from which ddocs fetches the LaTeX styles (get-tex-template). Required:
      the action fails immediately if it is empty. The consumer's default
      GITHUB_TOKEN is scoped to its own repo and will NOT work — supply a PAT
      or GitHub App token with access to that repo.
    required: true
  upload-to-release:
    description: 'Whether to upload PDFs to a GitHub release.'
    required: false
    default: 'true'
  release-tag:
    description: |
      Tag of an existing GitHub release to attach the built PDFs to. When set,
      the PDFs are uploaded to that release regardless of the triggering event
      (useful when this action runs from a workflow_run after a release, where
      there is no `release` event payload). When empty, the tag is taken from
      the `release` event payload (so the upload only happens on a release).
    required: false
    default: ''
  github-token:
    description: 'GitHub token for release uploads.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Fail fast on a missing styles token, before any install or compile, so a
    # misconfiguration surfaces immediately instead of as a confusing
    # "*.sty not found" pdflatex error minutes later.
    - name: Require latex-template-token
      if: inputs.latex-template-token == ''
      shell: bash
      run: |
        echo "::error::latex-template-token input is empty. Pass a token with read access to Deltares/LatexInstallation (typically wired from a repository or organization secret)."
        exit 1

    # Action-wide constants. Composite actions have no top-level `env:`, so we
    # publish them to $GITHUB_ENV in the first step and reference $VAR below.
    # DDOCS_REPO: pip target for the ddocs CLI, pinned to the commit behind the
    # doc_utils 0.2.0 release for reproducibility — bump the SHA (and the version
    # comment) after the `@` to upgrade ddocs. This is the single source of truth.
    - name: Define constants
      shell: bash
      run: |
        echo "DDOCS_REPO=git+https://github.com/Deltares-research/doc_utils.git@354afe0af29ad98a4a2506da7483bc0c96d4ac16" >> "$GITHUB_ENV"  # 0.2.0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}

    # Cache pip's download/wheel cache so ddocs and its dependencies — notably
    # the ~34 MB pypandoc-binary wheel — are not re-downloaded on every run.
    - name: Cache pip
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: latex-manual-pip-${{ runner.os }}-py${{ inputs.python-version }}

    # ddocs depends on pypandoc-binary, which bundles the pandoc executable in
    # the wheel — so installing ddocs also provides pandoc (no apt, no runtime
    # download). The markdown-to-latex step puts the bundled binary on PATH via
    # ddocs's check_pandoc_installed().
    - name: Install ddocs
      shell: bash
      run: |
        echo "::group::Installing ddocs"
        python -m pip install --upgrade pip
        python -m pip install "$DDOCS_REPO"
        ddocs --version
        echo "::endgroup::"

    - name: Fetch Deltares LaTeX Styles
      shell: bash
      env:
        # ddocs get-tex-template reads GITHUB_TOKEN for HTTPS auth against the
        # internal Deltares/LatexInstallation repo. --no-ssh disables the SSH
        # fallback (CI runners have no key), so auth is token → anonymous.
        GITHUB_TOKEN: ${{ inputs.latex-template-token }}
        LATEX_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "::group::Fetching Deltares LaTeX styles via ddocs get-tex-template"
        if ! ddocs get-tex-template --output-dir "$LATEX_DIR" --no-ssh; then
          echo "::warning::Failed to fetch Deltares LaTeX templates. Continuing without Deltares styles."
        fi
        echo "::endgroup::"

    # Skipped when markdown-input-dir is empty — for projects whose LaTeX is
    # authored directly (no Markdown source), leaving only style-fetch + compile.
    - name: Generate LaTeX from Markdown
      if: inputs.markdown-input-dir != ''
      shell: bash
      env:
        MARKDOWN_INPUT_DIR: ${{ inputs.markdown-input-dir }}
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "::group::Converting Markdown to LaTeX"
        ddocs markdown-to-latex \
          --input "$MARKDOWN_INPUT_DIR" \
          --output "$LATEX_OUTPUT_DIR"
        echo "::endgroup::"

    # Cache the *installed* TeX Live tree. apt installs into root-owned system
    # paths and generates format files, which actions/cache cannot restore
    # directly (it writes as the runner user). So we cache a single user-owned
    # tarball (created by the Install step on a miss) and sudo-extract it on a
    # hit. Bump the `-vN` key suffix to force a rebuild after changing the package set.
    - name: Cache TeX Live
      if: inputs.tex-files != ''
      id: texlive-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/texlive-cache.tar
        key: latex-manual-texlive-${{ runner.os }}-v4

    # On a cache hit: restore the tarball (no apt, no download). On a miss:
    # install via ddocs' apt backend and pack the files the install added (a
    # before/after filesystem diff) — so the next run can skip all of it.
    - name: Install LaTeX
      if: inputs.tex-files != ''
      shell: bash
      env:
        TEXLIVE_CACHE_HIT: ${{ steps.texlive-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        CACHE_FILE="$HOME/texlive-cache.tar"
        # Directories where the apt TeX Live install lands: binaries + their
        # alternatives symlinks (/usr/bin, /etc/alternatives), shared libs
        # (libkpathsea, …), the texmf trees, and the generated formats/ls-R.
        WATCH_DIRS=(/usr/bin /etc/alternatives /usr/lib/x86_64-linux-gnu \
                    /usr/share/texlive /usr/share/texmf /var/lib/texmf /etc/texmf)
        snapshot() {
          for d in "${WATCH_DIRS[@]}"; do
            [ -e "$d" ] && find "$d" \( -type f -o -type l \) 2>/dev/null
          done | sort -u
        }
        if [ "$TEXLIVE_CACHE_HIT" = "true" ] && [ -f "$CACHE_FILE" ]; then
          echo "::group::Restoring TeX Live from cache"
          sudo tar -xpf "$CACHE_FILE" -C /
          sudo ldconfig            # refresh the shared-library cache (libkpathsea, …)
          sudo mktexlsr            # refresh the ls-R filename databases
          echo "::endgroup::"
        else
          echo "::group::Installing pdflatex via ddocs (apt backend)"
          snapshot > /tmp/fs-before.txt
          ddocs pdflatex download --backend apt
          snapshot > /tmp/fs-after.txt
          echo "::endgroup::"
          echo "::group::Packing TeX Live for the cache"
          # Pack every file/symlink the install ADDED in those dirs — captures
          # binaries, alternatives symlinks (e.g. /usr/bin/bibtex), shared libs,
          # texmf data, and generated formats, regardless of dpkg ownership.
          comm -13 /tmp/fs-before.txt /tmp/fs-after.txt > /tmp/texlive-files.txt
          echo "Packing $(wc -l < /tmp/texlive-files.txt) new files/symlinks"
          sudo tar -cpf "$CACHE_FILE" --no-recursion -T /tmp/texlive-files.txt
          sudo chown "$(id -u):$(id -g)" "$CACHE_FILE"
          echo "::endgroup::"
        fi
        pdflatex --version

    - name: Compile PDF Documents
      if: inputs.tex-files != ''
      shell: bash
      env:
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
        TEX_FILES_INPUT: ${{ inputs.tex-files }}
      run: |
        echo "::group::Preparing LaTeX Compilation"
        cd "$LATEX_OUTPUT_DIR"
        IFS=',' read -ra TEX_FILES <<< "$TEX_FILES_INPUT"
        echo "Files to compile: ${TEX_FILES[*]}"
        echo "::endgroup::"

        echo "::group::First Pass - Initial Compilation"
        for tex_file in "${TEX_FILES[@]}"; do
          tex_file=$(echo "$tex_file" | xargs)
          if [ -n "$tex_file" ]; then
            echo "First pass: $tex_file.tex"
            pdflatex "$tex_file.tex"
          fi
        done
        echo "::endgroup::"

        echo "::group::Processing Citations with BibTeX"
        for tex_file in "${TEX_FILES[@]}"; do
          tex_file=$(echo "$tex_file" | xargs)
          if [ -n "$tex_file" ] && [ -f "$tex_file.aux" ]; then
            if grep -q '\\citation' "$tex_file.aux" 2>/dev/null; then
              echo "Running bibtex for $tex_file"
              bibtex "$tex_file"
            fi
          fi
        done
        echo "::endgroup::"

        echo "::group::Final Passes - Resolving References"
        for pass in 2 3; do
          echo "Pass $pass: compiling all documents"
          for tex_file in "${TEX_FILES[@]}"; do
            tex_file=$(echo "$tex_file" | xargs)
            if [ -n "$tex_file" ]; then
              echo "Pass $pass: $tex_file.tex"
              pdflatex "$tex_file.tex"
            fi
          done
        done
        echo "::endgroup::"

    - name: List Generated Files
      shell: bash
      env:
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "Generated LaTeX files:"
        find "$LATEX_OUTPUT_DIR" -name "*.tex" -type f
        echo "Generated PDF files:"
        find "$LATEX_OUTPUT_DIR" -name "*.pdf" -type f

    - name: Upload PDF Artifacts
      if: inputs.tex-files != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: LaTeX-Documentation
        path: ${{ inputs.latex-output-dir }}/*.pdf

    # Resolve which release tag to upload to: the explicit release-tag input
    # wins (e.g. when run from a workflow_run after a release); otherwise fall
    # back to the tag from a `release` event payload. Empty result => no upload.
    - name: Get Release Tag
      if: inputs.tex-files != '' && inputs.upload-to-release == 'true' && inputs.github-token != '' && (inputs.release-tag != '' || github.event_name == 'release')
      id: get_tag
      shell: bash
      env:
        RELEASE_TAG_INPUT: ${{ inputs.release-tag }}
        RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
      run: |
        tag=$(bash "$GITHUB_ACTION_PATH/scripts/resolve-release-tag.sh" "$RELEASE_TAG_INPUT" "$RELEASE_EVENT_TAG")
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Resolved release tag: $tag"

    - name: Upload PDFs to Release
      if: inputs.tex-files != '' && inputs.upload-to-release == 'true' && inputs.github-token != '' && steps.get_tag.outputs.tag != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        files: ${{ inputs.latex-output-dir }}/*.pdf
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
