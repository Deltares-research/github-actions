name: 'Generate LaTeX Documentation'
description: |
  Convert Markdown to LaTeX (and optionally PDF) using the ddocs CLI
  (https://github.com/Deltares-research/doc_utils). Deltares LaTeX styles are
  fetched by ddocs (get-tex-template) from the internal Deltares/LatexInstallation
  repo.

  Self-contained: installs its own Python and ddocs (which pulls in pandoc via
  pypandoc), and TeX Live when compiling PDFs. Does NOT touch the consumer's
  pyproject, lock file, or virtualenv — the action is a documentation pipeline
  that runs in isolation from the project's own dependency management.

inputs:
  python-version:
    description: 'Python version to install. ddocs requires >= 3.11.'
    required: false
    default: '3.12'
  tex-files:
    description: |
      Comma-separated list of .tex files (without extension) to compile to PDF.
      Empty means: run markdown-to-latex conversion only, skip pdflatex (and
      the heavy texlive install).
    required: false
    default: ''
  markdown-input-dir:
    description: 'Input directory containing Markdown files.'
    required: false
    default: 'docs/mkdocs/user_docs'
  latex-output-dir:
    description: 'Output directory for LaTeX (and PDF) files.'
    required: false
    default: 'docs/end-user-docs/source'
  latex-template-token:
    description: |
      Token with read access to the internal Deltares/LatexInstallation repo,
      from which ddocs fetches the LaTeX styles (get-tex-template). The
      consumer's default GITHUB_TOKEN is scoped to its own repo and will NOT
      work — supply a PAT or GitHub App token with access to that repo.
      When empty, the style fetch is attempted anonymously and (for the
      internal repo) fails gracefully with a warning; conversion still runs.
    required: false
    default: ''
  upload-to-release:
    description: 'Whether to upload PDFs to GitHub release.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for release uploads.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Action-wide constants. Composite actions have no top-level `env:`, so we
    # publish them to $GITHUB_ENV in the first step and reference $VAR below.
    # DDOCS_REPO: pip target for the ddocs CLI. Pinned to the `latex-templates`
    # branch — change the ref after the `@` to upgrade ddocs. This is the
    # single source of truth.
    - name: Define constants
      shell: bash
      run: |
        echo "DDOCS_REPO=git+https://github.com/Deltares-research/doc_utils.git@latex-templates" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}

    # ddocs brings pandoc with it (via its pypandoc dependency): the
    # markdown-to-latex step downloads a pandoc binary automatically if one
    # isn't already on PATH, so there is no separate pandoc install step.
    - name: Install ddocs
      shell: bash
      run: |
        echo "::group::Installing ddocs"
        python -m pip install --upgrade pip
        python -m pip install "$DDOCS_REPO"
        ddocs --version
        echo "::endgroup::"

    - name: Fetch Deltares LaTeX Styles
      shell: bash
      env:
        # ddocs get-tex-template reads GITHUB_TOKEN for HTTPS auth against the
        # internal Deltares/LatexInstallation repo. --no-ssh disables the SSH
        # fallback (CI runners have no key), so auth is token → anonymous.
        GITHUB_TOKEN: ${{ inputs.latex-template-token }}
        LATEX_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "::group::Fetching Deltares LaTeX styles via ddocs get-tex-template"
        if ! ddocs get-tex-template --output-dir "$LATEX_DIR" --no-ssh; then
          echo "::warning::Failed to fetch Deltares LaTeX templates. Continuing without Deltares styles."
        fi
        echo "::endgroup::"

    - name: Generate LaTeX from Markdown
      shell: bash
      env:
        MARKDOWN_INPUT_DIR: ${{ inputs.markdown-input-dir }}
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "::group::Converting Markdown to LaTeX"
        ddocs markdown-to-latex \
          --input "$MARKDOWN_INPUT_DIR" \
          --output "$LATEX_OUTPUT_DIR"
        echo "::endgroup::"

    - name: Install LaTeX
      if: inputs.tex-files != ''
      shell: bash
      run: |
        echo "::group::Installing LaTeX Packages"
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-bibtex-extra \
          texlive-science biber

        pdflatex --version
        echo "::endgroup::"

    - name: Compile PDF Documents
      if: inputs.tex-files != ''
      shell: bash
      env:
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
        TEX_FILES_INPUT: ${{ inputs.tex-files }}
      run: |
        echo "::group::Preparing LaTeX Compilation"
        cd "$LATEX_OUTPUT_DIR"
        IFS=',' read -ra TEX_FILES <<< "$TEX_FILES_INPUT"
        echo "Files to compile: ${TEX_FILES[*]}"
        echo "::endgroup::"

        echo "::group::First Pass - Initial Compilation"
        for tex_file in "${TEX_FILES[@]}"; do
          tex_file=$(echo "$tex_file" | xargs)
          if [ -n "$tex_file" ]; then
            echo "First pass: $tex_file.tex"
            pdflatex "$tex_file.tex"
          fi
        done
        echo "::endgroup::"

        echo "::group::Processing Citations with BibTeX"
        for tex_file in "${TEX_FILES[@]}"; do
          tex_file=$(echo "$tex_file" | xargs)
          if [ -n "$tex_file" ] && [ -f "$tex_file.aux" ]; then
            if grep -q '\\citation' "$tex_file.aux" 2>/dev/null; then
              echo "Running bibtex for $tex_file"
              bibtex "$tex_file"
            fi
          fi
        done
        echo "::endgroup::"

        echo "::group::Final Passes - Resolving References"
        for pass in 2 3; do
          echo "Pass $pass: compiling all documents"
          for tex_file in "${TEX_FILES[@]}"; do
            tex_file=$(echo "$tex_file" | xargs)
            if [ -n "$tex_file" ]; then
              echo "Pass $pass: $tex_file.tex"
              pdflatex "$tex_file.tex"
            fi
          done
        done
        echo "::endgroup::"

    - name: List Generated Files
      shell: bash
      env:
        LATEX_OUTPUT_DIR: ${{ inputs.latex-output-dir }}
      run: |
        echo "Generated LaTeX files:"
        find "$LATEX_OUTPUT_DIR" -name "*.tex" -type f
        echo "Generated PDF files:"
        find "$LATEX_OUTPUT_DIR" -name "*.pdf" -type f

    - name: Upload PDF Artifacts
      if: inputs.tex-files != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: LaTeX-Documentation
        path: ${{ inputs.latex-output-dir }}/*.pdf

    - name: Get Release Tag
      if: inputs.tex-files != '' && inputs.upload-to-release == 'true' && inputs.github-token != '' && github.event_name == 'release'
      id: get_tag
      shell: bash
      env:
        RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        echo "tag=$RELEASE_TAG_NAME" >> "$GITHUB_OUTPUT"

    - name: Upload PDFs to Release
      if: inputs.tex-files != '' && inputs.upload-to-release == 'true' && inputs.github-token != '' && steps.get_tag.outputs.tag != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        files: ${{ inputs.latex-output-dir }}/*.pdf
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
