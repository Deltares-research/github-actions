name: release/latex-manual - unit

# Tests for actions/release/latex-manual.
#
# Strategy
# --------
# The action is self-contained — it installs its own Python and ddocs (which
# pulls in pandoc via pypandoc), and TeX Live when compiling PDFs. It does not
# interact with the consumer's pyproject or virtualenv, so tests don't need the
# per-PM fixture matrix used elsewhere in this repo.
#
# Two external dependencies are handled as follows:
#   * Deltares styles: the action runs `ddocs get-tex-template` to fetch
#     LaTeX styles from the internal Deltares/LatexInstallation repo. Tests
#     pass no latex-template-token, so the fetch fails and the action's graceful
#     path emits a `::warning::` and continues. Every job thus implicitly
#     verifies that the fetch failure does not abort the pipeline.
#   * texlive + pdflatex: the action gates these on `tex-files != ''`. The
#     unit jobs leave `tex-files` empty (the default), skipping both the
#     ~5-minute apt install and pdflatex. The `pdf-compile-end-to-end` job
#     exercises the heavy path on `workflow_dispatch` only.
#
# The `ddocs` CLI (https://github.com/Deltares-research/doc_utils) is
# installed from git by the action — tests just let that happen and assert
# the markdown-to-latex step produced output.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MD_INPUT: tests/data/release-latex-manual/markdown

jobs:
  # ---------------------------------------------------------------------
  # Structural sanity: action.yml has the inputs and steps we depend on.
  # ---------------------------------------------------------------------
  action-yaml-structure:
    name: action.yml structural sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: sudo snap install yq || sudo apt-get install -y yq

      - name: Verify action.yml shape
        run: |
          ACTION=actions/release/latex-manual/action.yml
          for key in name description inputs runs; do
            if [ "$(yq eval ".${key}" "$ACTION")" = "null" ]; then
              echo "::error::action.yml is missing top-level '$key'"
              exit 1
            fi
          done
          # Every input the action contract advertises must exist.
          for input in python-version tex-files \
                       markdown-input-dir latex-output-dir \
                       latex-template-token upload-to-release github-token; do
            if [ "$(yq eval ".inputs.\"$input\"" "$ACTION")" = "null" ]; then
              echo "::error::action.yml is missing input '$input'"
              exit 1
            fi
          done
          # Inputs explicitly removed in refactors — guard against accidental
          # reintroduction. No PM coupling; ddocs is hardcoded to the upstream
          # git URL; artifact upload always fires when there are PDFs; and the
          # SVN inputs were replaced by ddocs get-tex-template (latex-template-token).
          for unwanted in package-manager dependency-groups install-extras \
                          poetry-extras pixi-environments \
                          pixi-activate-environment verify-lock ddocs-source \
                          upload-artifacts artifact-name artifact-retention-days \
                          svn-username svn-password svn-repo-url; do
            if [ "$(yq eval ".inputs.\"$unwanted\"" "$ACTION")" != "null" ]; then
              echo "::error::action.yml must NOT have input '$unwanted' (removed in a refactor)"
              exit 1
            fi
          done
          # latex-template-token must NOT be required — empty means "fetch
          # styles anonymously and continue gracefully if that fails".
          REQ=$(yq eval '.inputs."latex-template-token".required' "$ACTION")
          if [ "$REQ" = "true" ]; then
            echo "::error::latex-template-token must not be required (empty = graceful style-fetch failure)"
            exit 1
          fi
          # tex-files must NOT be required — empty means "skip pdflatex".
          REQ=$(yq eval '.inputs."tex-files".required' "$ACTION")
          if [ "$REQ" = "true" ]; then
            echo "::error::tex-files must not be required (empty = skip pdflatex)"
            exit 1
          fi
          USING=$(yq eval ".runs.using" "$ACTION")
          if [ "$USING" != "composite" ]; then
            echo "::error::action.runs.using must be 'composite', got: $USING"
            exit 1
          fi
          STEPS=$(yq eval ".runs.steps[].name" "$ACTION")
          for expected in "Set up Python" "Install ddocs" \
                          "Fetch Deltares LaTeX Styles" "Generate LaTeX from Markdown" \
                          "Install LaTeX" "Compile PDF Documents" \
                          "Upload PDF Artifacts" "Upload PDFs to Release"; do
            if ! echo "$STEPS" | grep -Fxq "$expected"; then
              echo "::error::action.yml is missing step: $expected"
              exit 1
            fi
          done
          echo "action.yml structure OK"

      - name: Verify pdflatex-related steps are gated on tex-files
        run: |
          ACTION=actions/release/latex-manual/action.yml
          for step in "Install LaTeX" "Compile PDF Documents" "Upload PDF Artifacts" "Get Release Tag" "Upload PDFs to Release"; do
            COND=$(yq eval ".runs.steps[] | select(.name == \"$step\") | .if" "$ACTION")
            if ! echo "$COND" | grep -q "tex-files != ''"; then
              echo "::error::step '$step' must be gated on tex-files != ''. Got: $COND"
              exit 1
            fi
          done
          echo "pdflatex gating OK"

  # ---------------------------------------------------------------------
  # Happy path: install + ddocs + graceful style-fetch failure (no token)
  # + markdown-to-latex. Asserts the converted .tex appears, and that
  # pdflatex/texlive did NOT run (tex-files is empty by default).
  # ---------------------------------------------------------------------
  convert-markdown-to-latex:
    name: convert markdown → latex (no pdflatex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md

      - name: Run action
        # No latex-template-token → the style fetch fails and the action continues
        # via its graceful warning path. This exercises that path on every run.
        uses: ./actions/release/latex-manual

      - name: Verify ddocs is on PATH after install
        run: ddocs --version

      - name: Verify ddocs converted markdown → latex
        run: |
          # ddocs writes one .tex per .md (default pattern '*.md').
          # Our fixture has a single index.md, so index.tex must appear.
          test -f docs/end-user-docs/source/index.tex || {
            echo "::error::ddocs markdown-to-latex did not produce index.tex"
            ls -la docs/end-user-docs/source
            exit 1
          }

      - name: Verify pdflatex was NOT run (tex-files empty)
        run: |
          if compgen -G "docs/end-user-docs/source/*.aux" > /dev/null; then
            echo "::error::found .aux files — pdflatex ran when it shouldn't have"; exit 1
          fi
          if command -v pdflatex >/dev/null; then
            echo "::error::pdflatex installed — texlive install ran when it shouldn't have"; exit 1
          fi

  # ---------------------------------------------------------------------
  # python-version is honored. The action passes it to actions/setup-python;
  # asserting the resulting interpreter version proves the wiring works.
  # ---------------------------------------------------------------------
  python-version-pin:
    name: python-version pin honored (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md

      - name: Run action with python-version=3.13
        uses: ./actions/release/latex-manual
        with:
          python-version: '3.13'

      - name: Verify Python 3.13 active
        run: python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

  # ---------------------------------------------------------------------
  # End-to-end pdflatex run. Heavy (~5 min for texlive install) so manual
  # only. Validates that with real tex-files values the texlive install,
  # 3 pdflatex passes, bibtex citation handling, and the comma-separated
  # multi-file loop all wire up correctly.
  #
  # Two .tex fixtures cover two paths through the action's compile loop:
  #   * sample.tex   — has \cite{} + bibliography → exercises the bibtex
  #                    branch that greps the .aux file for \citation.
  #   * sample2.tex  — plain document with no citations → exercises the
  #                    comma-separated multi-file path without conflating
  #                    it with the bibtex branch.
  # ---------------------------------------------------------------------
  pdf-compile-end-to-end:
    name: end-to-end pdflatex compile (workflow_dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md
          # Action runs `pdflatex <name>.tex` from inside latex-output-dir,
          # so all three files (two .tex + the .bib) live there.
          cp tests/data/release-latex-manual/end-to-end/sample.tex  docs/end-user-docs/source/sample.tex
          cp tests/data/release-latex-manual/end-to-end/sample2.tex docs/end-user-docs/source/sample2.tex
          cp tests/data/release-latex-manual/end-to-end/refs.bib    docs/end-user-docs/source/refs.bib

      - name: Run action with comma-separated tex-files
        uses: ./actions/release/latex-manual
        with:
          tex-files: 'sample,sample2'

      - name: Verify both PDFs were produced
        run: |
          for f in sample sample2; do
            test -f docs/end-user-docs/source/$f.pdf || {
              echo "::error::$f.pdf not found"; ls -la docs/end-user-docs/source; exit 1;
            }
          done

      - name: Verify pdflatex actually ran for both (.aux exists)
        run: |
          test -f docs/end-user-docs/source/sample.aux
          test -f docs/end-user-docs/source/sample2.aux

      - name: Verify bibtex branch fired for sample.tex
        run: |
          # The action greps .aux for \citation and runs bibtex when found.
          # bibtex produces a .bbl file alongside the .aux. Its presence
          # proves the bibtex branch executed (vs being silently skipped).
          test -f docs/end-user-docs/source/sample.bbl || {
            echo "::error::sample.bbl missing — bibtex did not run on sample.tex"
            ls -la docs/end-user-docs/source
            exit 1
          }
          # And sample2 (no citations) must NOT have a .bbl.
          if [ -f docs/end-user-docs/source/sample2.bbl ]; then
            echo "::error::sample2.bbl exists — bibtex ran on a doc with no \\cite"
            exit 1
          fi
