name: release/latex-manual - unit

# Tests for actions/release/latex-manual.
#
# Test tiers
# ----------
#   1. Static  (action-yaml-*)   — yq assertions on the action contract. No
#      action run; fast; always on push/PR.
#   2. Behavioral (lightweight)  — run the action with tex-files='' so neither
#      TeX Live nor pdflatex install. Each job isolates one input/behavior:
#      default python, pinned python, custom dirs, multi-file conversion,
#      graceful style-fetch failure (empty and bogus token). ~1 min each.
#   3. End-to-end (heavy)        — tex-files set, so TeX Live installs (~5 min)
#      and pdflatex runs. Covers the compile loop, bibtex branch, whitespace
#      trimming, and artifact upload/download. Runs on workflow_dispatch, or on
#      a pull_request ONLY when actions/release/latex-manual/ changed (the
#      `detect-changes` job decides), so unrelated PRs aren't taxed ~5 min.
#
# External dependencies
#   * Deltares styles: the action runs `ddocs get-tex-template` against the
#     internal Deltares/LatexInstallation repo. Tests pass no (or a bogus)
#     latex-template-token, so the fetch fails and the action's graceful path
#     emits a `::warning::` and continues. Every behavioral job thus implicitly
#     proves the fetch failure does not abort the pipeline.
#   * ddocs + pandoc: the action installs pandoc via apt (so ddocs/pypandoc
#     never has to download it — that path hits the unauthenticated GitHub API
#     and gets rate-limited on CI) and pip-installs ddocs from git. Tests let
#     that happen and assert on the produced .tex.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MD_INPUT: tests/data/release-latex-manual/markdown
  MD_MULTI: tests/data/release-latex-manual/markdown-multi

jobs:
  # ---------------------------------------------------------------------
  # Decide whether the heavy e2e tier should run on this event. It runs
  # when the composite action changed in a PR (diff base..head touches
  # actions/release/latex-manual/). On push the output is false; e2e then
  # only runs via workflow_dispatch.
  # ---------------------------------------------------------------------
  detect-changes:
    name: detect action changes
    runs-on: ubuntu-latest
    outputs:
      action-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base + head to diff a PR

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request; e2e gated to workflow_dispatch only"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^actions/release/latex-manual/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "actions/release/latex-manual/ changed in this PR -> e2e will run"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "actions/release/latex-manual/ unchanged -> e2e skipped"
          fi

  # =====================================================================
  # TIER 1 — STATIC: action.yml contract (no action execution)
  # =====================================================================
  action-yaml-structure:
    name: action.yml structural sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: sudo snap install yq || sudo apt-get install -y yq

      - name: Verify top-level shape + inputs exist
        run: |
          ACTION=actions/release/latex-manual/action.yml
          for key in name description inputs runs; do
            if [ "$(yq eval ".${key}" "$ACTION")" = "null" ]; then
              echo "::error::action.yml is missing top-level '$key'"
              exit 1
            fi
          done
          # Every input the action contract advertises must exist.
          for input in python-version tex-files \
                       markdown-input-dir latex-output-dir \
                       latex-template-token upload-to-release github-token; do
            if [ "$(yq eval ".inputs.\"$input\"" "$ACTION")" = "null" ]; then
              echo "::error::action.yml is missing input '$input'"
              exit 1
            fi
          done
          USING=$(yq eval ".runs.using" "$ACTION")
          if [ "$USING" != "composite" ]; then
            echo "::error::action.runs.using must be 'composite', got: $USING"
            exit 1
          fi
          echo "shape + inputs OK"

      - name: Verify removed inputs stay removed
        run: |
          ACTION=actions/release/latex-manual/action.yml
          # Guard against accidental reintroduction. No PM coupling; ddocs is
          # hardcoded to the upstream git URL; artifact upload always fires
          # when there are PDFs; SVN inputs were replaced by get-tex-template.
          for unwanted in package-manager dependency-groups install-extras \
                          poetry-extras pixi-environments \
                          pixi-activate-environment verify-lock ddocs-source \
                          upload-artifacts artifact-name artifact-retention-days \
                          svn-username svn-password svn-repo-url; do
            if [ "$(yq eval ".inputs.\"$unwanted\"" "$ACTION")" != "null" ]; then
              echo "::error::action.yml must NOT have input '$unwanted' (removed in a refactor)"
              exit 1
            fi
          done
          echo "removed-input guard OK"

      - name: Verify input requiredness + defaults
        run: |
          ACTION=actions/release/latex-manual/action.yml
          # latex-template-token and tex-files must be optional (their empty
          # defaults drive the graceful-failure / skip-pdflatex behaviors).
          for opt in latex-template-token tex-files; do
            if [ "$(yq eval ".inputs.\"$opt\".required" "$ACTION")" = "true" ]; then
              echo "::error::input '$opt' must not be required"
              exit 1
            fi
          done
          # Default dirs the consumers rely on must not silently change.
          test "$(yq eval '.inputs."markdown-input-dir".default' "$ACTION")" = "docs/mkdocs/user_docs" \
            || { echo "::error::markdown-input-dir default drifted"; exit 1; }
          test "$(yq eval '.inputs."latex-output-dir".default' "$ACTION")" = "docs/end-user-docs/source" \
            || { echo "::error::latex-output-dir default drifted"; exit 1; }
          test "$(yq eval '.inputs."python-version".default' "$ACTION")" = "3.12" \
            || { echo "::error::python-version default drifted"; exit 1; }
          echo "requiredness + defaults OK"

      - name: Verify steps exist + pdflatex gating
        run: |
          ACTION=actions/release/latex-manual/action.yml
          STEPS=$(yq eval ".runs.steps[].name" "$ACTION")
          for expected in "Define constants" "Install pandoc" "Set up Python" "Install ddocs" \
                          "Fetch Deltares LaTeX Styles" "Generate LaTeX from Markdown" \
                          "Install LaTeX" "Compile PDF Documents" \
                          "Upload PDF Artifacts" "Get Release Tag" "Upload PDFs to Release"; do
            if ! echo "$STEPS" | grep -Fxq "$expected"; then
              echo "::error::action.yml is missing step: $expected"
              exit 1
            fi
          done
          # texlive/pdflatex/upload steps must be gated on tex-files != ''.
          for step in "Install LaTeX" "Compile PDF Documents" "Upload PDF Artifacts" "Get Release Tag" "Upload PDFs to Release"; do
            COND=$(yq eval ".runs.steps[] | select(.name == \"$step\") | .if" "$ACTION")
            if ! echo "$COND" | grep -q "tex-files != ''"; then
              echo "::error::step '$step' must be gated on tex-files != ''. Got: $COND"
              exit 1
            fi
          done
          # Release steps must additionally gate on the github token.
          for step in "Get Release Tag" "Upload PDFs to Release"; do
            COND=$(yq eval ".runs.steps[] | select(.name == \"$step\") | .if" "$ACTION")
            echo "$COND" | grep -q "github-token != ''" || { echo "::error::$step not gated on github-token"; exit 1; }
          done
          # The release event gate lives on "Get Release Tag"; the upload step
          # inherits it transitively via steps.get_tag.outputs.tag (only set
          # when Get Release Tag runs, i.e. on a release event).
          TAG_COND=$(yq eval '.runs.steps[] | select(.name == "Get Release Tag") | .if' "$ACTION")
          echo "$TAG_COND" | grep -q "github.event_name == 'release'" \
            || { echo "::error::Get Release Tag not gated on release event"; exit 1; }
          UPLOAD_COND=$(yq eval '.runs.steps[] | select(.name == "Upload PDFs to Release") | .if' "$ACTION")
          echo "$UPLOAD_COND" | grep -q "steps.get_tag.outputs.tag != ''" \
            || { echo "::error::Upload PDFs to Release not gated on the release tag output"; exit 1; }
          echo "steps + gating OK"

      - name: Verify artifact step + ddocs constant + SHA-pinned actions
        run: |
          ACTION=actions/release/latex-manual/action.yml
          # Artifact name is the stable contract consumers download by.
          NAME=$(yq eval '.runs.steps[] | select(.name == "Upload PDF Artifacts") | .with.name' "$ACTION")
          test "$NAME" = "LaTeX-Documentation" || { echo "::error::artifact name changed: $NAME"; exit 1; }
          # DDOCS_REPO constant is the single source of truth for the ddocs pin.
          grep -q 'DDOCS_REPO=git+https://github.com/Deltares-research/doc_utils.git@' "$ACTION" \
            || { echo "::error::DDOCS_REPO constant missing or repo URL changed"; exit 1; }
          test "$(grep -c 'doc_utils.git' "$ACTION")" = "1" \
            || { echo "::error::ddocs repo URL must appear exactly once (single source of truth)"; exit 1; }
          # Third-party actions must be SHA-pinned (40-hex) per repo convention.
          THIRD_PARTY=$(yq eval '.runs.steps[].uses' "$ACTION" | grep -v '^null$' | grep -v '^Deltares-research/' || true)
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            sha="${ref##*@}"
            if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::third-party action not SHA-pinned: $ref"
              exit 1
            fi
          done <<< "$THIRD_PARTY"
          echo "artifact + constant + pinning OK"

  # =====================================================================
  # TIER 2 — BEHAVIORAL: run the action, tex-files='' (no TeX Live/pdflatex)
  # =====================================================================

  # Happy path + graceful no-token style fetch + default dirs.
  convert-markdown-to-latex:
    name: behavioral — convert markdown to latex (default dirs, no token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md

      - name: Run action
        # No latex-template-token → style fetch fails and the action continues
        # via its graceful warning path. Exercised on every run.
        uses: ./actions/release/latex-manual

      - name: Verify ddocs is on PATH after install
        run: ddocs --version

      - name: Verify ddocs converted markdown to latex
        run: |
          test -f docs/end-user-docs/source/index.tex || {
            echo "::error::ddocs markdown-to-latex did not produce index.tex"
            ls -la docs/end-user-docs/source
            exit 1
          }

      - name: Verify pdflatex/TeX Live did NOT run (tex-files empty)
        run: |
          if compgen -G "docs/end-user-docs/source/*.aux" > /dev/null; then
            echo "::error::found .aux files — pdflatex ran when it shouldn't have"; exit 1
          fi
          if command -v pdflatex >/dev/null; then
            echo "::error::pdflatex installed — texlive install ran when it shouldn't have"; exit 1
          fi

  # Default python-version (no input) resolves to 3.12.
  default-python-version:
    name: behavioral — default python-version is 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md
      - name: Run action (no python-version)
        uses: ./actions/release/latex-manual
      - name: Verify Python 3.12 active
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

  # python-version pin is honored.
  python-version-pin:
    name: behavioral — python-version pin honored (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md
      - name: Run action with python-version=3.13
        uses: ./actions/release/latex-manual
        with:
          python-version: '3.13'
      - name: Verify Python 3.13 active
        run: python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

  # markdown-input-dir + latex-output-dir are honored (non-default paths).
  custom-input-output-dirs:
    name: behavioral — custom markdown-input-dir + latex-output-dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage fixture in non-default input dir
        run: |
          mkdir -p custom/src
          cp $MD_INPUT/index.md custom/src/index.md
      - name: Run action with custom dirs
        uses: ./actions/release/latex-manual
        with:
          markdown-input-dir: custom/src
          latex-output-dir: custom/out
      - name: Verify .tex landed in the custom output dir
        run: |
          test -f custom/out/index.tex || {
            echo "::error::index.tex not found in custom/out"
            ls -la custom/out || true
            exit 1
          }
          # And nothing was written to the default location.
          if [ -f docs/end-user-docs/source/index.tex ]; then
            echo "::error::output written to default dir despite custom latex-output-dir"
            exit 1
          fi

  # Multiple .md inputs → one .tex each (conversion loop / glob).
  multiple-markdown-files:
    name: behavioral — multiple markdown files convert independently
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage two markdown files
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_MULTI/alpha.md docs/mkdocs/user_docs/alpha.md
          cp $MD_MULTI/beta.md  docs/mkdocs/user_docs/beta.md
      - name: Run action
        uses: ./actions/release/latex-manual
      - name: Verify both .tex files were produced
        run: |
          for f in alpha beta; do
            test -f docs/end-user-docs/source/$f.tex || {
              echo "::error::$f.tex not produced"; ls -la docs/end-user-docs/source; exit 1;
            }
          done

  # A bogus token still drives the action down the token→auth→fail→graceful
  # path (distinct from the empty-token anonymous path) without aborting.
  bogus-template-token-graceful:
    name: behavioral — bogus latex-template-token fails gracefully
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md
      - name: Run action with an invalid token
        uses: ./actions/release/latex-manual
        with:
          latex-template-token: 'ghp_thisIsNotARealTokenJustForTesting000000'
      - name: Verify conversion still happened despite bad token
        run: test -f docs/end-user-docs/source/index.tex

  # =====================================================================
  # TIER 3 — END-TO-END: tex-files set → TeX Live + pdflatex (heavy)
  # Runs on workflow_dispatch, or on a PR only when the composite action
  # changed (decided by the detect-changes job).
  # =====================================================================

  # Compile loop + bibtex branch (both directions) + whitespace trimming.
  #   * sample.tex  — has \cite{} + bibliography → bibtex branch fires.
  #   * sample2.tex — no citations → bibtex must be skipped.
  # tex-files uses a space after the comma to exercise the `xargs` trim.
  pdf-compile-end-to-end:
    name: e2e — pdflatex compile
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.action-changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          mkdir -p docs/mkdocs/user_docs docs/end-user-docs/source
          cp $MD_INPUT/index.md docs/mkdocs/user_docs/index.md
          # Action runs `pdflatex <name>.tex` from inside latex-output-dir,
          # so all three files (two .tex + the .bib) live there.
          cp tests/data/release-latex-manual/end-to-end/sample.tex  docs/end-user-docs/source/sample.tex
          cp tests/data/release-latex-manual/end-to-end/sample2.tex docs/end-user-docs/source/sample2.tex
          cp tests/data/release-latex-manual/end-to-end/refs.bib    docs/end-user-docs/source/refs.bib

      - name: Run action with comma+space separated tex-files
        uses: ./actions/release/latex-manual
        with:
          tex-files: 'sample, sample2'   # space exercises the xargs trim

      - name: Verify both PDFs were produced
        run: |
          for f in sample sample2; do
            test -f docs/end-user-docs/source/$f.pdf || {
              echo "::error::$f.pdf not found"; ls -la docs/end-user-docs/source; exit 1;
            }
          done

      - name: Verify pdflatex actually ran for both (.aux exists)
        run: |
          test -f docs/end-user-docs/source/sample.aux
          test -f docs/end-user-docs/source/sample2.aux

      - name: Verify bibtex branch fired only for the cited document
        run: |
          # bibtex produces a .bbl next to the .aux. Present for the cited doc,
          # absent for the uncited one — proves both branches of the grep.
          test -f docs/end-user-docs/source/sample.bbl || {
            echo "::error::sample.bbl missing — bibtex did not run on sample.tex"
            ls -la docs/end-user-docs/source
            exit 1
          }
          if [ -f docs/end-user-docs/source/sample2.bbl ]; then
            echo "::error::sample2.bbl exists — bibtex ran on a doc with no \\cite"
            exit 1
          fi

  # The artifact uploaded by the action above is downloadable and contains the
  # PDFs. Runs after the compile job and pulls the named artifact back.
  pdf-artifact-uploaded:
    name: e2e — PDF artifact is uploaded
    needs: [detect-changes, pdf-compile-end-to-end]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.action-changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download the action's artifact
        uses: actions/download-artifact@v4
        with:
          name: LaTeX-Documentation
          path: downloaded

      - name: Verify the PDFs are in the artifact
        run: |
          for f in sample sample2; do
            test -f downloaded/$f.pdf || {
              echo "::error::$f.pdf missing from the LaTeX-Documentation artifact"
              ls -la downloaded || true
              exit 1
            }
          done
