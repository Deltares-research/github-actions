name: release/github - unit

on:
  push:
  pull_request:
    paths:
      - 'actions/release/github/**'
      - '.github/workflows/test.release.unit.yml'
      - 'tests/data/release-github/**'
  workflow_dispatch:

# Unit tests for the small bash helpers under actions/release/github/scripts/.
# No remote and no real commitizen — `cz` is stubbed by tests/data/release-github/fake-cz
# where needed.

permissions:
  contents: read

jobs:
  test-is-prerelease:
    name: is-prerelease.sh - ${{ matrix.case.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          # PEP 440 prereleases (commitizen default scheme)
          - { version: "1.0.0a1",          expected: "true",  label: "PEP 440 alpha" }
          - { version: "1.0.0a3",          expected: "true",  label: "PEP 440 alpha (multi-digit)" }
          - { version: "1.0.0b1",          expected: "true",  label: "PEP 440 beta" }
          - { version: "1.0.0b0",          expected: "true",  label: "PEP 440 beta (zero suffix)" }
          - { version: "1.0.0rc1",         expected: "true",  label: "PEP 440 rc" }
          - { version: "1.0.0rc12",        expected: "true",  label: "PEP 440 rc (multi-digit)" }
          - { version: "1.0.0dev1",        expected: "true",  label: "PEP 440 dev (no dot)" }
          - { version: "1.0.0.dev1",       expected: "true",  label: "PEP 440 dev (with dot)" }

          # SemVer prereleases (commitizen with version_scheme = "semver")
          - { version: "1.0.0-alpha.1",    expected: "true",  label: "SemVer alpha" }
          - { version: "1.0.0-beta.1",     expected: "true",  label: "SemVer beta" }
          - { version: "1.0.0-rc.1",       expected: "true",  label: "SemVer rc" }
          - { version: "1.0.0-pre.1",      expected: "true",  label: "SemVer pre" }
          - { version: "1.0.0-dev.1",      expected: "true",  label: "SemVer dev" }

          # tag_format prefixes around either form
          - { version: "v1.0.0b1",         expected: "true",  label: "PEP 440 with v prefix" }
          - { version: "v1.0.0-beta.1",    expected: "true",  label: "SemVer with v prefix" }
          - { version: "pkg-1.0.0b1",      expected: "true",  label: "PEP 440 with pkg prefix" }
          - { version: "pkg-1.0.0-beta.1", expected: "true",  label: "SemVer with pkg prefix" }

          # Plain releases — must NOT be flagged
          - { version: "1.0.0",            expected: "false", label: "plain release" }
          - { version: "v1.0.0",           expected: "false", label: "plain release with v prefix" }
          - { version: "pkg-1.0.0",        expected: "false", label: "plain release with pkg prefix" }
          - { version: "0.1.0",            expected: "false", label: "plain release (low version)" }

          # PEP 440 post-release — explicitly NOT a prerelease
          - { version: "1.0.0.post1",      expected: "false", label: "PEP 440 post-release" }

          # Tag prefixes containing stray letters that look prerelease-ish but
          # don't form one of the recognised patterns
          - { version: "pkg-build-1.0.0",  expected: "false", label: "tag containing 'build'" }
          - { version: "release-1.0.0",    expected: "false", label: "tag starting with 'release'" }
          - { version: "library-1.0.0",    expected: "false", label: "tag starting with 'library' (contains 'b')" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script
        id: detect
        env:
          VERSION: ${{ matrix.case.version }}
        run: |
          ACTUAL=$(bash actions/release/github/scripts/is-prerelease.sh "$VERSION")
          echo "Input:    $VERSION"
          echo "Output:   $ACTUAL"
          echo "actual=$ACTUAL" >> $GITHUB_OUTPUT

      - name: Assert
        env:
          ACTUAL: ${{ steps.detect.outputs.actual }}
          EXPECTED: ${{ matrix.case.expected }}
          VERSION: ${{ matrix.case.version }}
        run: |
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "[OK] $VERSION -> $ACTUAL"
          else
            echo "::error::$VERSION expected $EXPECTED but got $ACTUAL"
            exit 1
          fi

  test-is-prerelease-usage:
    name: is-prerelease.sh - missing arg fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calling without arg should exit non-zero
        run: |
          set +e
          bash actions/release/github/scripts/is-prerelease.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected non-zero exit when called without an argument; got 0"
            exit 1
          fi
          echo "[OK] script exited $rc when called without an argument"

  test-next-version:
    name: next-version.sh - ${{ matrix.case.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { label: "dry-run returns a tag",
              dryrun_tag: "1.1.0",
              expected: "1.1.0" }
          - { label: "dry-run prints a tag then exits non-zero (messy tag history)",
              dryrun_tag: "3.1.0", dryrun_exit: "16",
              expected: "3.1.0" }
          - { label: "dry-run unusable, get-next provides the version",
              dryrun_exit: "16", getnext_version: "3.1.0",
              expected: "3.1.0" }
          - { label: "get-next bare version normalised via tag_format",
              dryrun_exit: "16", getnext_version: "3.1.0",
              tag_format_dir: "tests/data/release-github/tag-format",
              expected: "v3.1.0" }
          - { label: "both strategies fail -> error",
              dryrun_exit: "16", getnext_exit: "16",
              expect_failure: "true" }
          - { label: "prerelease type forwarded to commitizen",
              prerelease: "beta", dryrun_tag: "1.1.0b1",
              expected: "1.1.0b1", assert_args: "--prerelease beta" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run next-version.sh
        id: run
        env:
          FAKE_CZ_DRYRUN_TAG: ${{ matrix.case.dryrun_tag }}
          FAKE_CZ_DRYRUN_EXIT: ${{ matrix.case.dryrun_exit || '0' }}
          FAKE_CZ_GETNEXT_VERSION: ${{ matrix.case.getnext_version }}
          FAKE_CZ_GETNEXT_EXIT: ${{ matrix.case.getnext_exit || '0' }}
          INCREMENT: ${{ matrix.case.increment || 'minor' }}
          PRERELEASE: ${{ matrix.case.prerelease || 'none' }}
          TAG_FORMAT_DIR: ${{ matrix.case.tag_format_dir }}
        run: |
          SCRIPT="$GITHUB_WORKSPACE/actions/release/github/scripts/next-version.sh"
          CZ="$GITHUB_WORKSPACE/tests/data/release-github/fake-cz"
          export FAKE_CZ_ARGS_FILE="$RUNNER_TEMP/cz-args.txt"
          : > "$FAKE_CZ_ARGS_FILE"
          if [ -n "$TAG_FORMAT_DIR" ]; then cd "$GITHUB_WORKSPACE/$TAG_FORMAT_DIR"; fi
          set +e
          OUT=$(bash "$SCRIPT" "$INCREMENT" "$PRERELEASE" bash "$CZ")
          RC=$?
          set -e
          echo "Output: '$OUT' (rc=$RC)"
          echo "Args seen by fake-cz:"; cat "$FAKE_CZ_ARGS_FILE"
          {
            echo "rc=$RC"
            echo "out=$OUT"
            echo "args<<__ARGS__"
            cat "$FAKE_CZ_ARGS_FILE"
            echo "__ARGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Assert
        env:
          RC: ${{ steps.run.outputs.rc }}
          OUT: ${{ steps.run.outputs.out }}
          ARGS: ${{ steps.run.outputs.args }}
          EXPECTED: ${{ matrix.case.expected }}
          EXPECT_FAILURE: ${{ matrix.case.expect_failure || 'false' }}
          ASSERT_ARGS: ${{ matrix.case.assert_args }}
        run: |
          if [ "$EXPECT_FAILURE" = "true" ]; then
            if [ "$RC" -eq 0 ]; then
              echo "::error::expected non-zero exit, got 0 (out='$OUT')"
              exit 1
            fi
            echo "[OK] script failed as expected (rc=$RC)"
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::script exited $RC unexpectedly"
            exit 1
          fi
          if [ "$OUT" != "$EXPECTED" ]; then
            echo "::error::expected '$EXPECTED' but got '$OUT'"
            exit 1
          fi
          if [ -n "$ASSERT_ARGS" ] && ! printf '%s\n' "$ARGS" | grep -qF -- "$ASSERT_ARGS"; then
            echo "::error::expected fake-cz to be called with '$ASSERT_ARGS'; calls were: $ARGS"
            exit 1
          fi
          echo "[OK] -> '$OUT'"

  test-next-version-usage:
    name: next-version.sh - missing args fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calling with too few args should exit non-zero
        run: |
          set +e
          bash actions/release/github/scripts/next-version.sh minor
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected non-zero exit when called with too few arguments; got 0"
            exit 1
          fi
          echo "[OK] script exited $rc when called with too few arguments"

  test-validate-toolchain:
    name: validate-toolchain.sh - ${{ matrix.case.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { label: "uv: commitizen present",
              pm: uv }
          - { label: "uv: commitizen missing -> error",
              pm: uv, cz: "0", expect_failure: "true", error_contains: "commitizen" }
          - { label: "poetry: commitizen present",
              pm: poetry }
          - { label: "pixi (default env): commitizen present, uses 'pixi run'",
              pm: pixi, assert_args: "pixi run python -c import commitizen" }
          - { label: "pixi (env=dev): uses 'pixi run -e dev'",
              pm: pixi, pixi_env: "dev", assert_args: "pixi run -e dev python -c import commitizen" }
          - { label: "pixi: commitizen missing -> error",
              pm: pixi, cz: "0", expect_failure: "true", error_contains: "commitizen" }
          - { label: "uv + build-wheel=true: build check skipped (not pixi)",
              pm: uv, build: "0", build_wheel: "true", refute_args: "import build" }
          - { label: "pixi + build-wheel=true: build present",
              pm: pixi, build_wheel: "true", assert_args: "import build" }
          - { label: "pixi + build-wheel=true: build missing -> error",
              pm: pixi, build: "0", build_wheel: "true", expect_failure: "true", error_contains: "'build'" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validate-toolchain.sh
        id: run
        env:
          PM: ${{ matrix.case.pm }}
          PIXI_ENV: ${{ matrix.case.pixi_env }}
          BUILD_WHEEL: ${{ matrix.case.build_wheel || 'false' }}
          FAKE_PM_HAS_COMMITIZEN: ${{ matrix.case.cz || '1' }}
          FAKE_PM_HAS_BUILD: ${{ matrix.case.build || '1' }}
        run: |
          # Put fake uv/poetry/pixi (driven by FAKE_PM_* env vars) first on PATH.
          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          for pm in uv poetry pixi; do
            cp "$GITHUB_WORKSPACE/tests/data/release-github/fake-pm" "$FAKEBIN/$pm"
            chmod +x "$FAKEBIN/$pm"
          done
          export PATH="$FAKEBIN:$PATH"
          export FAKE_PM_ARGS_FILE="$RUNNER_TEMP/pm-args.txt"
          : > "$FAKE_PM_ARGS_FILE"

          set +e
          OUT=$(bash "$GITHUB_WORKSPACE/actions/release/github/scripts/validate-toolchain.sh" "$PM" "$PIXI_ENV" "$BUILD_WHEEL" 2>&1)
          RC=$?
          set -e
          echo "rc=$RC"
          echo "--- output ---"; echo "$OUT"
          echo "--- fake-pm calls ---"; cat "$FAKE_PM_ARGS_FILE"
          {
            echo "rc=$RC"
            echo "out<<__OUT__"; echo "$OUT"; echo "__OUT__"
            echo "args<<__ARGS__"; cat "$FAKE_PM_ARGS_FILE"; echo "__ARGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Assert
        env:
          RC: ${{ steps.run.outputs.rc }}
          OUT: ${{ steps.run.outputs.out }}
          ARGS: ${{ steps.run.outputs.args }}
          EXPECT_FAILURE: ${{ matrix.case.expect_failure || 'false' }}
          ERROR_CONTAINS: ${{ matrix.case.error_contains }}
          ASSERT_ARGS: ${{ matrix.case.assert_args }}
          REFUTE_ARGS: ${{ matrix.case.refute_args }}
        run: |
          if [ "$EXPECT_FAILURE" = "true" ]; then
            if [ "$RC" -eq 0 ]; then
              echo "::error::expected non-zero exit, got 0"
              exit 1
            fi
          else
            if [ "$RC" -ne 0 ]; then
              echo "::error::script exited $RC unexpectedly"
              exit 1
            fi
          fi
          if [ -n "$ERROR_CONTAINS" ] && ! printf '%s\n' "$OUT" | grep -qF -- "$ERROR_CONTAINS"; then
            echo "::error::expected the error output to contain '$ERROR_CONTAINS'; got: $OUT"
            exit 1
          fi
          if [ -n "$ASSERT_ARGS" ] && ! printf '%s\n' "$ARGS" | grep -qF -- "$ASSERT_ARGS"; then
            echo "::error::expected the package manager to be called with '$ASSERT_ARGS'; calls were: $ARGS"
            exit 1
          fi
          if [ -n "$REFUTE_ARGS" ] && printf '%s\n' "$ARGS" | grep -qF -- "$REFUTE_ARGS"; then
            echo "::error::package manager should NOT have been called with '$REFUTE_ARGS'; calls were: $ARGS"
            exit 1
          fi
          echo "[OK] rc=$RC"

  test-validate-toolchain-usage:
    name: validate-toolchain.sh - missing args fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calling with too few args should exit non-zero
        run: |
          set +e
          bash actions/release/github/scripts/validate-toolchain.sh uv
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected non-zero exit when called with too few arguments; got 0"
            exit 1
          fi
          echo "[OK] script exited $rc when called with too few arguments"

  test-linkify-refs:
    name: linkify-refs.sh - ${{ matrix.case.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { label: "commitizen (#N) form",
              input: "- reorganize into subpackages (#31)",
              expected: "- reorganize into subpackages ([#31](https://github.com/o/r/issues/31))" }
          - { label: "scoped commit with ref",
              input: "- **cli**: extract entry-point (#29)",
              expected: "- **cli**: extract entry-point ([#29](https://github.com/o/r/issues/29))" }
          - { label: "two inline refs both linked",
              input: "fixes #1 and #2 together",
              expected: "fixes [#1](https://github.com/o/r/issues/1) and [#2](https://github.com/o/r/issues/2) together" }
          - { label: "ref at start of line",
              input: "#7 was the cause",
              expected: "[#7](https://github.com/o/r/issues/7) was the cause" }
          - { label: "already-linked ref left untouched",
              input: "see [#10](https://github.com/o/r/issues/10) here",
              expected: "see [#10](https://github.com/o/r/issues/10) here" }
          - { label: "no references unchanged",
              input: "- downgrade numpy for compatibility",
              expected: "- downgrade numpy for compatibility" }
          - { label: "changelog version header unchanged",
              input: "## 2.6.0 (2026-06-03)",
              expected: "## 2.6.0 (2026-06-03)" }
          - { label: "hash not followed by digit unchanged",
              input: "use the # symbol or #tag",
              expected: "use the # symbol or #tag" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script
        id: run
        env:
          INPUT: ${{ matrix.case.input }}
        run: |
          ACTUAL=$(printf '%s\n' "$INPUT" | bash actions/release/github/scripts/linkify-refs.sh "https://github.com/o/r")
          echo "Input:    $INPUT"
          echo "Output:   $ACTUAL"
          {
            echo "actual<<EOF"
            echo "$ACTUAL"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Assert
        env:
          ACTUAL: ${{ steps.run.outputs.actual }}
          EXPECTED: ${{ matrix.case.expected }}
        run: |
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "[OK] $ACTUAL"
          else
            echo "::error::expected [$EXPECTED] but got [$ACTUAL]"
            exit 1
          fi

  test-linkify-refs-usage:
    name: linkify-refs.sh - missing arg fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calling without arg should exit non-zero
        run: |
          set +e
          echo "body" | bash actions/release/github/scripts/linkify-refs.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected non-zero exit when called without an argument; got 0"
            exit 1
          fi
          echo "[OK] script exited $rc when called without an argument"

  version-wiring:
    name: version input is forwarded to every package-manager step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # release/github composes the inner python-setup/<pm> actions @main, so a
      # runtime forwarding check can't work until the version input exists on
      # main. Assert the wiring statically instead: each of the uv, poetry and
      # pixi setup steps must forward the version input, so a dropped or renamed
      # line is caught here.
      - name: Assert version is forwarded to uv, poetry and pixi steps
        run: |
          count=$(grep -cE '^[[:space:]]+version:[[:space:]]+.*inputs\.version' actions/release/github/action.yml)
          echo "version-forwarding lines found: $count (expected 3)"
          if [ "$count" -ne 3 ]; then
            echo "::error::release/github must forward version to 3 package-manager steps, found $count"
            exit 1
          fi

  summary:
    runs-on: ubuntu-latest
    needs:
      - test-is-prerelease
      - test-is-prerelease-usage
      - test-next-version
      - test-next-version-usage
      - test-validate-toolchain
      - test-validate-toolchain-usage
      - test-linkify-refs
      - test-linkify-refs-usage
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Release Action Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- is-prerelease matrix:       ${{ needs.test-is-prerelease.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- is-prerelease usage:        ${{ needs.test-is-prerelease-usage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- next-version matrix:        ${{ needs.test-next-version.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- next-version usage:         ${{ needs.test-next-version-usage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- validate-toolchain matrix:  ${{ needs.test-validate-toolchain.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- validate-toolchain usage:   ${{ needs.test-validate-toolchain-usage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- linkify-refs matrix:        ${{ needs.test-linkify-refs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- linkify-refs usage:         ${{ needs.test-linkify-refs-usage.result }}" >> $GITHUB_STEP_SUMMARY
