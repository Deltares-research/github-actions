name: releases-table - check

# Fails when README.md's "Latest releases" table no longer matches the git tags.
#
# Consumers pin the commit SHA from that table, so a stale row hands people a bad
# or non-existent ref (it once advertised `latex/v1.1.0`, a tag that never
# existed). The table is generated by .github/workflows/scripts/generate-releases-table.sh;
# this job asserts it was regenerated.
#
# Note the triggers: the table goes stale when TAGS move, not when files change, so
# a path-filtered pull_request trigger alone would never notice a new release. The
# weekly schedule is what actually catches that.
#
# Deliberately NOT triggered on tag pushes. The table records the commit a tag
# resolves to, which is self-referential: cutting tag X/v1.3.0 at commit M means
# README *at M* would have to already contain the row "X/v1.3.0 -> M", which it
# cannot -- M was authored before the tag existed. Such a run could never be made
# green (the commit is tagged and immutable; the fix lands in a later commit), so
# it would fail on every single release until people learned to ignore this check.
# The schedule and main-push runs catch the same drift on a tree that can be fixed.

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/scripts/generate-releases-table.sh'
      - '.github/workflows/ci.releases-table.yml'
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — catches a release whose tag landed without a README bump.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: table matches tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required: the script reads `git tag -l` and `git rev-list`. The default
          # shallow checkout fetches no tags, which would render an empty table.
          fetch-depth: 0

      - name: Check README releases table is up to date
        run: bash .github/workflows/scripts/generate-releases-table.sh --check
