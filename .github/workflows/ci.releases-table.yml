name: releases-table - check

# Fails when README.md's "Latest releases" table no longer matches the git tags.
#
# Consumers pin the commit SHA from that table, so a stale row hands people a bad
# or non-existent ref (it once advertised `latex/v1.1.0`, a tag that never
# existed). The table is generated by .github/workflows/scripts/generate-releases-table.sh;
# this job asserts it was regenerated.
#
# Manual only, by choice.
#
# Tags in this repo are cut by hand, and refreshing the table is a documented step
# of that procedure (see docs/versioning.md) -- so the procedure, not this job, is
# what keeps the table honest. Run this when you want to confirm it, e.g. after a
# release or before pointing a consumer at a SHA:
#
#   gh workflow run ci.releases-table.yml
#
# Or check the same thing locally, without CI:
#
#   .github/workflows/scripts/generate-releases-table.sh --check
#
# Trade-off worth knowing: nothing catches drift on its own now. A tag cut without
# the refresh step leaves a stale SHA in the README until someone runs this. The
# automatic triggers were dropped because they fire on events that cannot fix
# themselves -- a push to main red-lines whichever contributor merged next for a
# release they did not cut, and a tag push can never be green at all (the table
# records the commit a tag resolves to, so the tagged commit cannot contain its own
# row). A check that cries wolf gets ignored, which is worse than one you invoke.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: table matches tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required: the script reads `git tag -l` and `git rev-list`. The default
          # shallow checkout fetches no tags, which would render an empty table.
          fetch-depth: 0

      - name: Check README releases table is up to date
        run: bash .github/workflows/scripts/generate-releases-table.sh --check
