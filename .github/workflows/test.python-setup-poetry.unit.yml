name: Test setup-python-poetry

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-setup-python-poetry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage fixture (basic)
        run: |
          cp tests/data/poetry/basic/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/basic/poetry.lock ./poetry.lock

      - name: Test setup-python-poetry action
        uses: ./actions/python-setup/poetry
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev
          verify-lock: 'true'

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')[:2]))"

      - name: Verify Poetry is installed
        run: |
          poetry --version

      - name: Verify dev group dependency installed
        run: |
          poetry run python -c "import pytest; print('pytest', pytest.__version__)"

  test-multiple-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage fixture (multi-groups)
        run: |
          cp tests/data/poetry/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/multi-groups/poetry.lock ./poetry.lock

      - name: Test multiple groups
        uses: ./actions/python-setup/poetry
        with:
          install-groups: dev docs test
          verify-lock: 'true'

      - name: Verify installation worked
        run: |
          poetry show

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage fixture (extras)
        run: |
          cp tests/data/poetry/extras/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/extras/poetry.lock ./poetry.lock

      - name: Test extras installation
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'dev,docs'
          verify-lock: 'true'

      - name: Verify extras installed
        run: |
          poetry run python -c "import pytest, sphinx; print('pytest', pytest.__version__, 'sphinx', sphinx.__version__)"
