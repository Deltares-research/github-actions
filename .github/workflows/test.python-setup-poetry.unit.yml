name: Test setup-python-poetry

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-setup-python-poetry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test project
        run: |
          cat > pyproject.toml << 'EOF'
          [tool.poetry]
          name = "test-poetry"
          version = "0.1.0"
          description = "Test project for python-setup/poetry action"
          authors = ["Test <test@example.com>"]

          [tool.poetry.dependencies]
          python = "^3.12"
          requests = "*"

          [tool.poetry.group.dev.dependencies]
          pytest = "*"

          [tool.poetry.group.docs.dependencies]
          sphinx = "*"

          [build-system]
          requires = ["poetry-core"]
          build-backend = "poetry.core.masonry.api"
          EOF

      - name: Generate poetry.lock
        run: |
          pip install poetry
          poetry lock

      - name: Test setup-python-poetry action
        uses: ./actions/python-setup/poetry
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev
          verify-lock: 'false'

      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')[:2]))"

      - name: Verify Poetry is installed
        run: |
          poetry --version

      - name: Verify dev group dependency installed
        run: |
          poetry run python -c "import pytest; print('pytest', pytest.__version__)"

  test-multiple-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test project
        run: |
          cat > pyproject.toml << 'EOF'
          [tool.poetry]
          name = "test-poetry-multi"
          version = "0.1.0"
          description = "Multi-group test"
          authors = ["Test <test@example.com>"]

          [tool.poetry.dependencies]
          python = "^3.12"
          requests = "*"

          [tool.poetry.group.dev.dependencies]
          pytest = "*"
          black = "*"

          [tool.poetry.group.docs.dependencies]
          sphinx = "*"
          mkdocs = "*"

          [tool.poetry.group.test.dependencies]
          coverage = "*"

          [build-system]
          requires = ["poetry-core"]
          build-backend = "poetry.core.masonry.api"
          EOF

      - name: Generate poetry.lock
        run: |
          pip install poetry
          poetry lock

      - name: Test multiple groups
        uses: ./actions/python-setup/poetry
        with:
          install-groups: dev docs test
          verify-lock: 'false'

      - name: Verify installation worked
        run: |
          poetry show

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test project with extras
        run: |
          cat > pyproject.toml << 'EOF'
          [tool.poetry]
          name = "test-poetry-extras"
          version = "0.1.0"
          description = "Extras test"
          authors = ["Test <test@example.com>"]

          [tool.poetry.dependencies]
          python = "^3.12"
          requests = "*"
          sphinx = { version = "*", optional = true }
          pytest = { version = "*", optional = true }

          [tool.poetry.extras]
          docs = ["sphinx"]
          dev = ["pytest"]

          [build-system]
          requires = ["poetry-core"]
          build-backend = "poetry.core.masonry.api"
          EOF

      - name: Generate poetry.lock
        run: |
          pip install poetry
          poetry lock

      - name: Test extras installation
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'dev,docs'
          verify-lock: 'false'

      - name: Verify extras installed
        run: |
          poetry run python -c "import pytest, sphinx; print('pytest', pytest.__version__, 'sphinx', sphinx.__version__)"