name: python-setup/poetry - unit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  defaults:
    name: defaults (no groups, no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/defaults/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          verify-lock: 'true'

      - name: Verify only main deps installed
        run: |
          poetry run python -c "import requests"
          # Neither pytest nor sphinx should be present (no groups/extras requested)
          if poetry run python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest should NOT be installed when no groups requested"
            exit 1
          fi
          if poetry run python -c "import sphinx" 2>/dev/null; then
            echo "::error::sphinx should NOT be installed when no extras requested"
            exit 1
          fi

  python-matrix:
    name: python-matrix (single group)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/basic/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/basic/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev
          verify-lock: 'true'

      - name: Verify Python version + dev group installed
        run: |
          python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')[:2]))"
          poetry run python -c "import pytest; print('pytest', pytest.__version__)"

  multi-groups-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/multi-groups/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-groups: 'dev docs test'
          verify-lock: 'true'

      - name: Verify all three groups installed
        run: |
          poetry run python -c "import pytest, black, sphinx, mkdocs, coverage"

  multi-groups-comma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/multi-groups/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-groups: 'dev,docs,test'
          verify-lock: 'true'

      - name: Verify all three groups installed
        run: |
          poetry run python -c "import pytest, black, sphinx, mkdocs, coverage"

  single-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/extras/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/extras/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify only docs extra installed
        run: |
          poetry run python -c "import sphinx"
          if poetry run python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest extra should NOT be installed"
            exit 1
          fi

  multi-extras-comma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/extras/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/extras/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'dev,docs'
          verify-lock: 'true'

      - name: Verify both extras installed
        run: |
          poetry run python -c "import pytest, sphinx"

  multi-extras-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/extras/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/extras/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'dev docs'
          verify-lock: 'true'

      - name: Verify both extras installed
        run: |
          poetry run python -c "import pytest, sphinx"

  groups-and-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/combined/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/combined/poetry.lock ./poetry.lock

      - name: Run action
        uses: ./actions/python-setup/poetry
        with:
          install-groups: 'dev'
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify both group and extra installed
        run: |
          poetry run python -c "import pytest, sphinx"

  verify-lock-stale:
    name: verify-lock with stale lock should fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage stale fixture
        run: |
          cp tests/data/poetry/stale/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/stale/poetry.lock ./poetry.lock

      - name: Run action (expected to fail at verify-lock)
        id: run
        continue-on-error: true
        uses: ./actions/python-setup/poetry
        with:
          verify-lock: 'true'

      - name: Assert action failed
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected action to fail on stale lock, but outcome was ${{ steps.run.outcome }}"
            exit 1
          fi
          echo "Action correctly failed on stale lock"

  verify-lock-disabled:
    name: verify-lock=false works on healthy lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/basic/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/basic/poetry.lock ./poetry.lock

      - name: Run action with verify-lock disabled
        uses: ./actions/python-setup/poetry
        with:
          install-groups: dev
          verify-lock: 'false'

      - name: Verify install proceeded
        run: |
          poetry run python -c "import pytest"

  poetry-version-pin:
    name: poetry-version pin honored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/defaults/poetry.lock ./poetry.lock

      - name: Run action with pinned poetry version
        uses: ./actions/python-setup/poetry
        with:
          version: '2.3.0'
          verify-lock: 'true'

      - name: Verify pinned poetry version active
        run: |
          INSTALLED=$(poetry --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installed poetry: $INSTALLED"
          if [ "$INSTALLED" != "2.3.0" ]; then
            echo "::error::Expected poetry 2.3.0, got $INSTALLED"
            exit 1
          fi

  poetry-version-empty-defaults:
    name: empty version falls back to default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/defaults/poetry.lock ./poetry.lock

      # An explicit empty string is what a wrapper action forwards when its own
      # version input is unset; it must resolve to the action's pinned default,
      # not to "latest".
      - name: Run action with empty version
        uses: ./actions/python-setup/poetry
        with:
          version: ''
          verify-lock: 'true'

      - name: Verify default poetry version active
        run: |
          INSTALLED=$(poetry --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installed poetry: $INSTALLED"
          if [ "$INSTALLED" != "2.5.1" ]; then
            echo "::error::Expected default poetry 2.5.1, got $INSTALLED"
            exit 1
          fi

  cache-write-true-saves:
    name: cache-write=true persists cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture with per-run-unique lock
        # Inject github.run_id into poetry.lock as a comment so hashFiles produces
        # a unique cache key for this CI run — guarantees we start from an
        # empty cache state regardless of prior CI history.
        run: |
          cp tests/data/poetry/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/defaults/poetry.lock ./poetry.lock
          sed -i "1i # test-run-${{ github.run_id }}-write-true" poetry.lock

      # Resolve the same Python patch the action will, so the verify key below
      # matches what the action saves under (the action keys on the resolved
      # patch version, not the coarse python-version input).
      - name: Resolve Python patch version
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run action with cache-write enabled
        uses: ./actions/python-setup/poetry
        with:
          # Pin the same version the verify step resolves, so the action's save
          # key matches regardless of the action's default python-version.
          python-version: '3.12'
          cache-write: 'true'

      - name: Wait for cache propagation
        # actions/cache/save returns success but the cache is not always
        # immediately queryable from the same job. Brief sleep avoids flakes.
        run: sleep 10

      - name: Look up cache after action ran
        id: verify
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.virtualenvs
          key: poetry-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.5.1-${{ hashFiles('**/poetry.lock') }}
          lookup-only: true

      - name: Assert cache was saved
        run: |
          # Guard issue #14's actual contract: the key must carry the Python
          # *patch* (3.12.<n>), not the coarse minor — otherwise a runner patch
          # bump would not bust the cache. A revert to a coarse key fails here
          # even though save/verify would still agree.
          RESOLVED="${{ steps.setup-python.outputs.python-version }}"
          echo "Resolved Python version embedded in the cache key: $RESOLVED"
          if ! printf '%s' "$RESOLVED" | grep -qE '^3\.12\.[0-9]+$'; then
            echo "::error::cache key is not patch-granular (expected 3.12.<patch>, got '$RESOLVED') — issue #14 regression"
            exit 1
          fi
          if [ "${{ steps.verify.outputs.cache-hit }}" != "true" ]; then
            echo "::error::cache-write=true should have saved cache, but key was not found"
            exit 1
          fi
          echo "Cache was correctly saved under a patch-granular key"

  cache-write-false-skips-save:
    name: cache-write=false skips cache save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture with per-run-unique lock
        run: |
          cp tests/data/poetry/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/defaults/poetry.lock ./poetry.lock
          sed -i "1i # test-run-${{ github.run_id }}-write-false" poetry.lock

      # Build the lookup key the action *would* save under (same resolved
      # patch), so that if cache-write=false ever wrongly saved a venv, the
      # "not found" assertion below would catch it. In this negative case the
      # key only has to match the action's real key; its format is not
      # re-validated here (the cache-write=true job does that).
      - name: Resolve Python patch version
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run action with cache-write disabled
        uses: ./actions/python-setup/poetry
        with:
          # Pin the same version the verify step resolves, so the action's save
          # key matches regardless of the action's default python-version.
          python-version: '3.12'
          cache-write: 'false'

      - name: Look up cache after action ran
        id: verify
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.virtualenvs
          key: poetry-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.5.1-${{ hashFiles('**/poetry.lock') }}
          lookup-only: true

      - name: Assert cache was NOT saved
        run: |
          if [ "${{ steps.verify.outputs.cache-hit }}" == "true" ]; then
            echo "::error::cache-write=false should NOT have saved cache, but key was found"
            exit 1
          fi
          echo "Cache was correctly skipped"

  sync-reconciles-on-input-change:
    name: poetry sync removes stale deps when inputs change
    # Invokes the action twice in one job with different extras and verifies
    # the second venv matches the second request only. Proves `poetry sync`
    # correctly reconciles a cache-restored venv to the new input set
    # (contamination-impossible by design, not just by test ordering).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture with per-run-unique lock
        run: |
          cp tests/data/poetry/extras/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/extras/poetry.lock ./poetry.lock
          sed -i "1i # test-run-${{ github.run_id }}-reconcile" poetry.lock

      - name: First run — extras=dev (installs pytest only)
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'dev'
          verify-lock: 'true'

      - name: Verify only pytest after first run
        run: |
          poetry run python -c "import pytest"
          if poetry run python -c "import sphinx" 2>/dev/null; then
            echo "::error::sphinx should NOT be installed after first sync (extras=dev only)"
            exit 1
          fi

      - name: 'Second run — extras=docs (should reconcile: remove pytest, add sphinx)'
        uses: ./actions/python-setup/poetry
        with:
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify sync reconciled (sphinx in, pytest out)
        # Uses `poetry run pip list` (reads venv dist-info dirs — the actual
        # installed packages) rather than `poetry show` (which lists everything
        # in the lockfile, marking uninstalled-but-locked packages with `(!)`)
        # or `import pytest` (which can succeed via PEP 420 namespace packages
        # for empty leftover directories after uninstall).
        run: |
          echo "=== poetry run pip list (actually-installed packages in venv) ==="
          poetry run pip list
          echo
          if ! poetry run pip list | grep -qiE '^sphinx +'; then
            echo "::error::sphinx should be installed after poetry sync --extras docs"
            exit 1
          fi
          if poetry run pip list | grep -qiE '^pytest +'; then
            echo "::error::pytest should NOT be installed after poetry sync --extras docs"
            exit 1
          fi
          echo "PASS: sphinx in, pytest out"

  messy-input-parsing:
    name: tolerate whitespace and mixed separators in install-groups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage fixture
        run: |
          cp tests/data/poetry/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/poetry/multi-groups/poetry.lock ./poetry.lock

      - name: Run action with messy input
        uses: ./actions/python-setup/poetry
        with:
          # Leading/trailing whitespace, comma+space mix, repeated separators
          install-groups: '  dev , docs ,test  '
          verify-lock: 'true'

      - name: Verify all three groups installed correctly
        run: |
          poetry run python -c "import pytest, black, sphinx, mkdocs, coverage"
