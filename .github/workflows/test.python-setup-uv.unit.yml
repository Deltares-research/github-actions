name: python-setup/uv - unit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  defaults:
    name: defaults (no groups, no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/uv/defaults/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          verify-lock: 'true'

      - name: Verify only main deps installed
        run: |
          uv pip list | grep -i requests
          # Neither pytest nor sphinx should be present (no groups/extras requested)
          if uv pip list | grep -iE '^(pytest|sphinx) '; then
            echo "::error::Unexpected dependency installed when no groups/extras requested"
            exit 1
          fi

  python-matrix:
    name: python-matrix (single group)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/basic/pyproject.toml ./pyproject.toml
          cp tests/data/uv/basic/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev
          verify-lock: 'true'

      - name: Verify Python version + dev group installed
        run: |
          python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')[:2]))"
          uv run python -c "import pytest; print('pytest', pytest.__version__)"

  multi-groups-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/uv/multi-groups/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-groups: 'dev docs test'
          verify-lock: 'true'

      - name: Verify all three groups installed
        run: |
          uv run python -c "import pytest, black, sphinx, mkdocs, coverage"

  multi-groups-comma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/uv/multi-groups/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-groups: 'dev,docs,test'
          verify-lock: 'true'

      - name: Verify all three groups installed
        run: |
          uv run python -c "import pytest, black, sphinx, mkdocs, coverage"

  single-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/extras/pyproject.toml ./pyproject.toml
          cp tests/data/uv/extras/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify only docs extra installed
        run: |
          uv run python -c "import sphinx"
          if uv run python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest extra should NOT be installed"
            exit 1
          fi

  multi-extras-comma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/extras/pyproject.toml ./pyproject.toml
          cp tests/data/uv/extras/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-extras: 'dev,docs'
          verify-lock: 'true'

      - name: Verify both extras installed
        run: |
          uv run python -c "import pytest, sphinx"

  multi-extras-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/extras/pyproject.toml ./pyproject.toml
          cp tests/data/uv/extras/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-extras: 'dev docs'
          verify-lock: 'true'

      - name: Verify both extras installed
        run: |
          uv run python -c "import pytest, sphinx"

  groups-and-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/combined/pyproject.toml ./pyproject.toml
          cp tests/data/uv/combined/uv.lock ./uv.lock

      - name: Run action
        uses: ./actions/python-setup/uv
        with:
          install-groups: 'dev'
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify both group and extra installed
        run: |
          uv run python -c "import pytest, sphinx"

  verify-lock-stale:
    name: verify-lock with stale lock should fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage stale fixture
        run: |
          cp tests/data/uv/stale/pyproject.toml ./pyproject.toml
          cp tests/data/uv/stale/uv.lock ./uv.lock

      - name: Run action (expected to fail at verify-lock)
        id: run
        continue-on-error: true
        uses: ./actions/python-setup/uv
        with:
          verify-lock: 'true'

      - name: Assert action failed
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected action to fail on stale lock, but outcome was ${{ steps.run.outcome }}"
            exit 1
          fi
          echo "Action correctly failed on stale lock"

  verify-lock-disabled:
    name: verify-lock=false works on healthy lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/basic/pyproject.toml ./pyproject.toml
          cp tests/data/uv/basic/uv.lock ./uv.lock

      - name: Run action with verify-lock disabled
        uses: ./actions/python-setup/uv
        with:
          install-groups: dev
          verify-lock: 'false'

      - name: Verify install proceeded
        run: |
          uv run python -c "import pytest"

  uv-version-pin:
    name: uv-version pin honored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/uv/defaults/uv.lock ./uv.lock

      - name: Run action with pinned uv version
        uses: ./actions/python-setup/uv
        with:
          version: '0.9.5'
          verify-lock: 'true'

      - name: Verify pinned uv version active
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "Installed uv: $INSTALLED"
          if [ "$INSTALLED" != "0.9.5" ]; then
            echo "::error::Expected uv 0.9.5, got $INSTALLED"
            exit 1
          fi

  uv-version-empty-defaults:
    name: empty version falls back to default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/uv/defaults/uv.lock ./uv.lock

      # An explicit empty string is what a wrapper action forwards when its own
      # version input is unset; it must resolve to the action's pinned default,
      # not to "latest".
      - name: Run action with empty version
        uses: ./actions/python-setup/uv
        with:
          version: ''
          verify-lock: 'true'

      - name: Verify default uv version active
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "Installed uv: $INSTALLED"
          if [ "$INSTALLED" != "0.11.28" ]; then
            echo "::error::Expected default uv 0.11.28, got $INSTALLED"
            exit 1
          fi

  cache-write-true-saves:
    name: cache-write=true persists cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture with per-run-unique lock
        # Inject github.run_id into uv.lock as a comment so hashFiles produces
        # a unique cache key for this CI run — guarantees we start from an
        # empty cache state regardless of prior CI history.
        run: |
          cp tests/data/uv/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/uv/defaults/uv.lock ./uv.lock
          sed -i "1i # test-run-${{ github.run_id }}-write-true" uv.lock

      - name: Run action with cache-write enabled
        uses: ./actions/python-setup/uv
        with:
          cache-write: 'true'

      - name: Wait for cache propagation
        # actions/cache/save returns success but the cache is not always
        # immediately queryable from the same job. Brief sleep avoids flakes.
        run: sleep 10

      - name: Look up cache after action ran
        id: verify
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py3.12-uv0.11.28-${{ hashFiles('**/uv.lock') }}
          lookup-only: true

      - name: Assert cache was saved
        run: |
          if [ "${{ steps.verify.outputs.cache-hit }}" != "true" ]; then
            echo "::error::cache-write=true should have saved cache, but key was not found"
            exit 1
          fi
          echo "Cache was correctly saved"

  cache-write-false-skips-save:
    name: cache-write=false skips cache save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture with per-run-unique lock
        run: |
          cp tests/data/uv/defaults/pyproject.toml ./pyproject.toml
          cp tests/data/uv/defaults/uv.lock ./uv.lock
          sed -i "1i # test-run-${{ github.run_id }}-write-false" uv.lock

      - name: Run action with cache-write disabled
        uses: ./actions/python-setup/uv
        with:
          cache-write: 'false'

      - name: Look up cache after action ran
        id: verify
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py3.12-uv0.11.28-${{ hashFiles('**/uv.lock') }}
          lookup-only: true

      - name: Assert cache was NOT saved
        run: |
          if [ "${{ steps.verify.outputs.cache-hit }}" == "true" ]; then
            echo "::error::cache-write=false should NOT have saved cache, but key was found"
            exit 1
          fi
          echo "Cache was correctly skipped"

  sync-reconciles-on-input-change:
    name: uv sync --frozen removes stale deps when inputs change
    # Invokes the action twice in one job with different extras and verifies
    # the second venv matches the second request only. Proves `uv sync --frozen`
    # reconciles correctly even when the previous run installed different extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture with per-run-unique lock
        run: |
          cp tests/data/uv/extras/pyproject.toml ./pyproject.toml
          cp tests/data/uv/extras/uv.lock ./uv.lock
          sed -i "1i # test-run-${{ github.run_id }}-reconcile" uv.lock

      - name: First run — extras=dev (installs pytest only)
        uses: ./actions/python-setup/uv
        with:
          install-extras: 'dev'
          verify-lock: 'true'

      - name: Verify only pytest after first run
        run: |
          uv run python -c "import pytest"
          if uv run python -c "import sphinx" 2>/dev/null; then
            echo "::error::sphinx should NOT be installed after first sync (extras=dev only)"
            exit 1
          fi

      - name: 'Second run — extras=docs (should reconcile: remove pytest, add sphinx)'
        uses: ./actions/python-setup/uv
        with:
          install-extras: 'docs'
          verify-lock: 'true'

      - name: Verify sync reconciled (sphinx in, pytest out)
        # Asserts against `uv pip list` (the authoritative installed-package
        # list) rather than `import pytest`. uninstall can leave empty package
        # directories that Python's PEP 420 namespace-package mechanism makes
        # importable with __file__=None — even though the package is gone.
        run: |
          echo "=== uv pip list (authoritative installed list) ==="
          uv pip list
          echo
          if ! uv pip list | grep -qiE '^sphinx +'; then
            echo "::error::sphinx should be installed after uv sync --frozen --extra docs"
            exit 1
          fi
          if uv pip list | grep -qiE '^pytest +'; then
            echo "::error::pytest should NOT be in uv's installed list after uv sync --frozen --extra docs"
            exit 1
          fi
          echo "PASS: sphinx in, pytest out"

  messy-input-parsing:
    name: tolerate whitespace and mixed separators in install-groups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage fixture
        run: |
          cp tests/data/uv/multi-groups/pyproject.toml ./pyproject.toml
          cp tests/data/uv/multi-groups/uv.lock ./uv.lock

      - name: Run action with messy input
        uses: ./actions/python-setup/uv
        with:
          # Leading/trailing whitespace, comma+space mix, repeated separators
          install-groups: '  dev , docs ,test  '
          verify-lock: 'true'

      - name: Verify all three groups installed correctly
        run: |
          uv run python -c "import pytest, black, sphinx, mkdocs, coverage"
