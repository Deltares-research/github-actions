name: releases-table - check

# Fails when README.md's "Latest releases" table no longer matches the git tags.
#
# Consumers pin the commit SHA from that table, so a stale row hands people a bad
# or non-existent ref (it once advertised `latex/v1.1.0`, a tag that never
# existed). The table is generated by .github/scripts/generate-releases-table.sh;
# this job asserts it was regenerated.
#
# Note the triggers: the table goes stale when TAGS move, not when files change.
# A path-filtered pull_request trigger alone would never notice a new release, so
# tag pushes and a weekly sweep are what actually catch drift.

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/scripts/generate-releases-table.sh'
      - '.github/workflows/check.releases-table.yml'
  push:
    branches: [main]
    tags: ['*']
  schedule:
    # Monday 06:00 UTC — catches a release whose tag landed without a README bump.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: table matches tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required: the script reads `git tag -l` and `git rev-list`. The default
          # shallow checkout fetches no tags, which would render an empty table.
          fetch-depth: 0

      - name: Check README releases table is up to date
        run: bash .github/scripts/generate-releases-table.sh --check
